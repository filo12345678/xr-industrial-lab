<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <title>Laboratorio XR - Brazo Robótico</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <style>

        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

        }

    </style>



    <script>


        // =====================================================
        // MOVIMIENTO EN PC
        //
        // W = adelante
        // S = atrás
        // A = izquierda
        // D = derecha
        //
        // E = subir
        // Q = bajar
        //
        // Mouse = mirar
        //
        // IMPORTANTE:
        // NO funciona durante AR o VR.
        // =====================================================

        AFRAME.registerComponent(
            'movimiento-pc',
            {

                schema: {

                    velocidad: {

                        type: 'number',

                        default: 2.0

                    },


                    velocidadVertical: {

                        type: 'number',

                        default: 1.5

                    },


                    alturaMinima: {

                        type: 'number',

                        default: 0.25

                    },


                    alturaMaxima: {

                        type: 'number',

                        default: 5.0

                    }

                },


                init: function () {


                    this.teclas = {};


                    this.keyDown =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = true;


                            if (

                                evento.code === 'KeyW' ||
                                evento.code === 'KeyA' ||
                                evento.code === 'KeyS' ||
                                evento.code === 'KeyD' ||
                                evento.code === 'KeyQ' ||
                                evento.code === 'KeyE'

                            ) {

                                evento.preventDefault();

                            }

                        };


                    this.keyUp =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = false;

                        };


                    window.addEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.addEventListener(
                        'keyup',
                        this.keyUp
                    );

                },



                tick: function (
                    tiempo,
                    delta
                ) {


                    if (!delta) {

                        return;

                    }


                    const escena =
                        this.el.sceneEl;



                    // =================================================
                    // EN AR O VR NO INTERFERIR
                    // =================================================

                    if (

                        escena.is('ar-mode') ||
                        escena.is('vr-mode')

                    ) {

                        return;

                    }


                    const dt =
                        delta / 1000;


                    const rig =
                        this.el.object3D;


                    const camara =
                        document.getElementById(
                            'camara'
                        );


                    if (!camara) {

                        return;

                    }



                    // =================================================
                    // ORIENTACIÓN DE LA CÁMARA
                    // =================================================

                    const q =
                        new THREE.Quaternion();


                    camara.object3D
                        .getWorldQuaternion(
                            q
                        );



                    // =================================================
                    // ADELANTE
                    // =================================================

                    const adelante =
                        new THREE.Vector3(
                            0,
                            0,
                            -1
                        );


                    adelante.applyQuaternion(
                        q
                    );


                    adelante.y = 0;


                    if (
                        adelante.lengthSq() > 0
                    ) {

                        adelante.normalize();

                    }



                    // =================================================
                    // DERECHA
                    // =================================================

                    const derecha =
                        new THREE.Vector3(
                            1,
                            0,
                            0
                        );


                    derecha.applyQuaternion(
                        q
                    );


                    derecha.y = 0;


                    if (
                        derecha.lengthSq() > 0
                    ) {

                        derecha.normalize();

                    }



                    // =================================================
                    // W
                    // =================================================

                    if (
                        this.teclas['KeyW']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =================================================
                    // S
                    // =================================================

                    if (
                        this.teclas['KeyS']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =================================================
                    // D
                    // =================================================

                    if (
                        this.teclas['KeyD']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =================================================
                    // A
                    // =================================================

                    if (
                        this.teclas['KeyA']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =================================================
                    // E = SUBIR
                    // =================================================

                    if (
                        this.teclas['KeyE']
                    ) {

                        rig.position.y +=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =================================================
                    // Q = BAJAR
                    // =================================================

                    if (
                        this.teclas['KeyQ']
                    ) {

                        rig.position.y -=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =================================================
                    // LIMITES
                    // =================================================

                    rig.position.y =
                        THREE.MathUtils.clamp(

                            rig.position.y,

                            this.data
                                .alturaMinima,

                            this.data
                                .alturaMaxima

                        );

                },



                remove: function () {


                    window.removeEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.removeEventListener(
                        'keyup',
                        this.keyUp
                    );

                }

            }
        );



        // =====================================================
        // AJUSTE DEL RIG AL ENTRAR EN XR
        //
        // En PC empieza a 1.6 m.
        //
        // En AR / VR:
        // WebXR controla la posición real.
        // =====================================================

        AFRAME.registerComponent(
            'rig-xr',
            {

                init: function () {


                    const rig =
                        this.el;


                    this.posicionPC =
                        new THREE.Vector3();



                    rig.sceneEl.addEventListener(
                        'enter-vr',
                        () => {


                            this.posicionPC.copy(
                                rig.object3D.position
                            );


                            // El tracking del teléfono /
                            // visor controla la pose.

                            rig.object3D.position.set(
                                0,
                                0,
                                0
                            );

                        }
                    );



                    rig.sceneEl.addEventListener(
                        'exit-vr',
                        () => {


                            rig.object3D.position.copy(
                                this.posicionPC
                            );

                        }
                    );

                }

            }
        );



        // =====================================================
        // AR SIMPLE
        //
        // NO HAY ANCHOR.
        // NO HAY TARGET EN ar-hit-test.
        //
        // Cada toque simplemente cambia la posición
        // del contenedor del CAD.
        //
        // Puedes tocar nuevamente para moverlo.
        // =====================================================

        AFRAME.registerComponent(
            'ar-simple',
            {

                init: function () {


                    const escena =
                        this.el;


                    const modelo =
                        document.getElementById(
                            'modeloXR'
                        );



                    // =================================================
                    // ENTRAR EN AR
                    // =================================================

                    escena.addEventListener(
                        'enter-vr',
                        () => {


                            if (
                                !escena.is('ar-mode')
                            ) {

                                return;

                            }


                            // Ocultar hasta que el usuario
                            // seleccione una superficie.

                            modelo.object3D.visible =
                                false;

                        }
                    );



                    // =================================================
                    // USUARIO TOCA UNA SUPERFICIE
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-select',
                        (evento) => {


                            if (
                                !escena.is('ar-mode')
                            ) {

                                return;

                            }


                            const detalle =
                                evento.detail;


                            if (
                                !detalle ||
                                !detalle.position
                            ) {

                                return;

                            }



                            // =================================================
                            // SOLO CAMBIAMOS POSICIÓN
                            // =================================================

                            modelo.object3D.position.copy(
                                detalle.position
                            );


                            modelo.object3D.visible =
                                true;



                            /*
                            IMPORTANTE:

                            NO bloqueamos nada.

                            NO desactivamos Hit Test.

                            NO creamos Anchor.

                            NO copiamos orientación.

                            Si quieres mover el robot:
                            toca otra superficie.
                            */

                        }
                    );



                    // =================================================
                    // SALIR DE XR
                    // =================================================

                    escena.addEventListener(
                        'exit-vr',
                        () => {


                            modelo.object3D.position.set(
                                0,
                                0,
                                -3
                            );


                            modelo.object3D.visible =
                                true;

                        }
                    );

                }

            }
        );



        // =====================================================
        // CONFIRMAR CARGA DEL GLB
        // =====================================================

        AFRAME.registerComponent(
            'modelo-cargado',
            {

                init: function () {


                    this.el.addEventListener(
                        'model-loaded',
                        () => {


                            console.log(
                                'Modelo CAD cargado correctamente.'
                            );

                        }
                    );


                    this.el.addEventListener(
                        'model-error',
                        (evento) => {


                            console.error(
                                'Error cargando modelo CAD:',
                                evento.detail
                            );

                        }
                    );

                }

            }
        );


    </script>

</head>



<body>



<!-- =========================================================
     ESCENA
========================================================= -->

<a-scene


    <!-- =====================================================
         AR + VR
    ====================================================== -->

    xr-mode-ui="
        XRMode: xr
    "



    <!-- =====================================================
         WEBXR

         SIN dom-overlay
         SIN anchors
    ====================================================== -->

    webxr="
        optionalFeatures: hit-test;
        referenceSpaceType: local;
    "



    <!-- =====================================================
         HIT TEST

         NO TIENE target.

         El GLB NO participa en el Hit Test.

         type: map = retículo simple.
    ====================================================== -->

    ar-hit-test="
        type: map;
        mapSize: 0.20 0.20;
    "



    ar-simple



    <!-- =====================================================
         RENDERIZADO LIGERO

         antialias false reduce trabajo del GPU móvil.
    ====================================================== -->

    renderer="
        antialias: false;
        colorManagement: true;
        alpha: true;
    "
>



    <!-- =====================================================
         MODELO CAD
    ====================================================== -->

    <a-assets timeout="30000">


        <a-asset-item

            id="modeloIndustrial"

            src="./models/modelo_industrial.glb">

        </a-asset-item>


    </a-assets>



    <!-- =====================================================
         UNA SOLA LUZ

         Las luces tienen coste de renderizado.
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="1.3">

    </a-light>



    <!-- =====================================================
         CONTENEDOR DEL ROBOT

         En AR movemos únicamente este elemento.
    ====================================================== -->

    <a-entity

        id="modeloXR"

        position="0 0 -3"

        visible="true"
    >



        <!-- =================================================
             CAD
        ================================================== -->

        <a-entity

            id="robotCAD"

            gltf-model="#modeloIndustrial"

            modelo-cargado


            <!--
            Vista lateral.
            -->

            rotation="0 90 0"


            <!--
            Escala pequeña para AR.
            -->

            scale="0.003 0.003 0.003"


            position="0 0 0">

        </a-entity>


    </a-entity>



    <!-- =====================================================
         PISO PARA PC / VR

         Igual que prueba-ar.html:
         se oculta automáticamente en AR.
    ====================================================== -->

    <a-plane

        position="0 0 -3"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#78909C"

        hide-on-enter-ar>

    </a-plane>



    <!-- =====================================================
         CIELO PC / VR
    ====================================================== -->

    <a-sky

        color="#DCE6EA"

        hide-on-enter-ar>

    </a-sky>



    <!-- =====================================================
         RIG
    ====================================================== -->

    <a-entity

        id="rig"

        position="0 1.6 0"

        rig-xr

        movimiento-pc="
            velocidad: 2;
            velocidadVertical: 1.5;
            alturaMinima: 0.25;
            alturaMaxima: 5;
        "
    >



        <!-- =================================================
             CÁMARA
             
             PC:
             mouse
             
             CELULAR:
             IMU / Magic Window
             
             VR:
             tracking del visor
        ================================================== -->

        <a-camera

            id="camara"

            position="0 0 0"

            look-controls="
                enabled: true;
                mouseEnabled: true;
                touchEnabled: true;
                magicWindowTrackingEnabled: true;
            ">

        </a-camera>


    </a-entity>



</a-scene>



</body>

</html>
