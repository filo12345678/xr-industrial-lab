<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Laboratorio XR - Modelo CAD Industrial</title>


    <!-- =====================================================
         A-FRAME 1.8.0
    ====================================================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        html,
        body {

            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        #overlay {

            position: fixed;

            top: 15px;
            left: 15px;

            width: 300px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;

            pointer-events: none;
        }


        #titulo {

            font-size: 17px;

            font-weight: bold;

            color: #00ff88;

            margin-bottom: 8px;
        }


        .ok {

            color: #00ff88;
        }


        .error {

            color: #ff5555;
        }


        .esperando {

            color: #ffcc00;
        }


        #estadoModelo {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }


        #instruccionAR {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }

    </style>



    <script>

        // =====================================================
        // COMPONENTE:
        // DETECTA SI EL MODELO GLB CARGÓ CORRECTAMENTE
        // =====================================================

        AFRAME.registerComponent(
            'control-modelo',
            {

                init: function () {

                    const modelo = this.el;


                    modelo.addEventListener(
                        'model-loaded',
                        function () {

                            console.log(
                                'MODELO GLB CARGADO CORRECTAMENTE'
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='ok'>" +
                                    "Modelo CAD: cargado correctamente" +
                                    "</span>";

                            }

                        }
                    );


                    modelo.addEventListener(
                        'model-error',
                        function (evento) {

                            console.error(
                                'ERROR CARGANDO MODELO GLB:',
                                evento.detail
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='error'>" +
                                    "Modelo CAD: error al cargar" +
                                    "</span>";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // COMPONENTE:
        // ESTADO DEL HIT TEST
        // =====================================================

        AFRAME.registerComponent(
            'control-hit-test',
            {

                init: function () {

                    const escena = this.el;


                    // -------------------------------------------------
                    // COMIENZA A BUSCAR SUPERFICIES
                    // -------------------------------------------------

                    escena.addEventListener(
                        'ar-hit-test-start',
                        function () {

                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "Buscando superficies..." +
                                    "<br>" +
                                    "Mueve lentamente el dispositivo.";

                            }

                        }
                    );


                    // -------------------------------------------------
                    // SUPERFICIE DETECTADA
                    // -------------------------------------------------

                    escena.addEventListener(
                        'ar-hit-test-achieved',
                        function () {

                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Superficie detectada." +
                                    "</span>" +
                                    "<br>" +
                                    "Toca la pantalla para colocar " +
                                    "el modelo.";

                            }

                        }
                    );


                    // -------------------------------------------------
                    // MODELO COLOCADO
                    // -------------------------------------------------

                    escena.addEventListener(
                        'ar-hit-test-select',
                        function () {

                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Modelo colocado." +
                                    "</span>" +
                                    "<br>" +
                                    "Puedes tocar otra superficie " +
                                    "para cambiar su posición.";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // COMPATIBILIDAD WEBXR
        // =====================================================

        async function comprobarXR() {

            const estadoWebXR =
                document.getElementById(
                    'estadoWebXR'
                );


            const estadoVR =
                document.getElementById(
                    'estadoVR'
                );


            const estadoAR =
                document.getElementById(
                    'estadoAR'
                );


            // -------------------------------------------------
            // ¿EXISTE WEBXR?
            // -------------------------------------------------

            if (!navigator.xr) {

                estadoWebXR.innerHTML =
                    'WebXR: no disponible';

                estadoWebXR.className =
                    'error';


                estadoVR.innerHTML =
                    'VR: no disponible';

                estadoVR.className =
                    'error';


                estadoAR.innerHTML =
                    'AR: no disponible';

                estadoAR.className =
                    'error';


                return;

            }


            estadoWebXR.innerHTML =
                'WebXR: disponible';

            estadoWebXR.className =
                'ok';



            // -------------------------------------------------
            // VR
            // -------------------------------------------------

            try {

                const soportaVR =
                    await navigator.xr.isSessionSupported(
                        'immersive-vr'
                    );


                if (soportaVR) {

                    estadoVR.innerHTML =
                        'VR: compatible';

                    estadoVR.className =
                        'ok';

                }

                else {

                    estadoVR.innerHTML =
                        'VR: no compatible';

                    estadoVR.className =
                        'error';

                }

            }

            catch (error) {

                estadoVR.innerHTML =
                    'VR: error';

                estadoVR.className =
                    'error';

            }



            // -------------------------------------------------
            // AR
            // -------------------------------------------------

            try {

                const soportaAR =
                    await navigator.xr.isSessionSupported(
                        'immersive-ar'
                    );


                if (soportaAR) {

                    estadoAR.innerHTML =
                        'AR: compatible';

                    estadoAR.className =
                        'ok';

                }

                else {

                    estadoAR.innerHTML =
                        'AR: no compatible';

                    estadoAR.className =
                        'error';

                }

            }

            catch (error) {

                estadoAR.innerHTML =
                    'AR: error';

                estadoAR.className =
                    'error';

            }

        }


        window.addEventListener(
            'load',
            comprobarXR
        );

    </script>

</head>



<body>


<!-- =========================================================
     PANEL DE ESTADO
========================================================= -->

<div id="overlay">


    <div id="titulo">

        MODELO CAD INDUSTRIAL XR

    </div>


    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>


    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>


    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>


    <div
        id="estadoModelo"
        class="esperando">

        Modelo CAD: cargando...

    </div>


    <div id="instruccionAR">

        En modo AR podrás colocar el modelo
        sobre una superficie real.

    </div>


</div>



<!-- =========================================================
     ESCENA A-FRAME
========================================================= -->

<a-scene


    xr-mode-ui="
        XRMode: xr
    "


    webxr="
        optionalFeatures: hit-test;
        referenceSpaceType: local;
    "


    ar-hit-test="
        target: #objetoXR;
        type: footprint;
    "


    control-hit-test


    renderer="
        colorManagement: true;
        antialias: true;
        alpha: true;
    "


    background="
        color: #DCE6EA;
        transparent: true;
    "
>


    <!-- =====================================================
         RECURSOS
    ====================================================== -->

    <a-assets timeout="30000">


        <!--
        ======================================================
        MODELO CAD

        LA RUTA DEBE SER EXACTAMENTE:

        models/modelo_industrial.glb
        ======================================================
        -->

        <a-asset-item

            id="modeloIndustrial"

            src="./models/modelo_industrial.glb">

        </a-asset-item>


    </a-assets>



    <!-- =====================================================
         ILUMINACIÓN
    ====================================================== -->


    <a-entity

        light="
            type: ambient;
            color: #FFFFFF;
            intensity: 1;
        ">

    </a-entity>



    <a-entity

        light="
            type: directional;
            color: #FFFFFF;
            intensity: 1;
            castShadow: true;
        "

        position="-3 5 3">

    </a-entity>



    <a-entity

        light="
            type: directional;
            color: #FFFFFF;
            intensity: 0.5;
        "

        position="4 3 -4">

    </a-entity>



    <!-- =====================================================
         CONTENEDOR DEL HIT TEST

         ESTE OBJETO ES MOVIDO POR WEBXR.
    ====================================================== -->

    <a-entity

        id="objetoXR"

        position="0 0 -3"

        rotation="0 0 0"

        scale="1 1 1"
    >


        <!-- =================================================
             MODELO CAD

             AJUSTA SOLO ESTOS 3 PARÁMETROS SI ES NECESARIO:

             position
             rotation
             scale
        ================================================== -->

        <a-entity

            id="robotCAD"

            gltf-model="#modeloIndustrial"

            control-modelo

            position="0 0 0"

            rotation="0 0 0"

            scale="0.01 0.01 0.01"

            shadow="
                cast: true;
                receive: true;
            ">

        </a-entity>


    </a-entity>



    <!-- =====================================================
         REFERENCIA DEL ORIGEN
         PEQUEÑO CÍRCULO ROJO

         NOS AYUDA A SABER DÓNDE ESTÁ Z = 0
    ====================================================== -->

    <a-cylinder

        position="0 0.01 -3"

        radius="0.08"

        height="0.02"

        color="#FF0000"

        hide-on-enter-ar>

    </a-cylinder>



    <!-- =====================================================
         PISO PARA PC
         DESAPARECE EN AR
    ====================================================== -->

    <a-plane

        hide-on-enter-ar

        position="0 0 -3"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#78909C"

        shadow="
            receive: true;
        ">

    </a-plane>



    <!-- =====================================================
         CIELO
         DESAPARECE EN AR
    ====================================================== -->

    <a-sky

        hide-on-enter-ar

        color="#DCE6EA">

    </a-sky>



    <!-- =====================================================
         CÁMARA
    ====================================================== -->

    <a-entity

        id="rig"

        position="0 1.6 0"
    >


        <a-camera

            position="0 0 0"

            look-controls

            wasd-controls>

        </a-camera>


    </a-entity>


</a-scene>


</body>

</html>
