<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Laboratorio XR - Modelo CAD Industrial</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        #overlay {

            position: fixed;

            top: 15px;
            left: 15px;

            width: 310px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;

            pointer-events: none;

            transition: opacity 0.3s ease;
        }


        #titulo {

            color: #00ff88;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .ok {

            color: #00ff88;
        }


        .error {

            color: #ff5555;
        }


        .esperando {

            color: #ffcc00;
        }


        #estadoModelo,
        #controlesPC,
        #instruccionAR {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }



        /* ==================================================
           PANEL PEQUEÑO DURANTE AR
        ================================================== */

        #overlay.modoAR {

            width: 245px;

            background: rgba(0, 0, 0, 0.65);
        }


        #overlay.modoAR #titulo,
        #overlay.modoAR #estadoWebXR,
        #overlay.modoAR #estadoVR,
        #overlay.modoAR #estadoAR,
        #overlay.modoAR #estadoModelo,
        #overlay.modoAR #controlesPC {

            display: none;
        }


        #overlay.modoAR #instruccionAR {

            margin: 0;

            padding: 0;

            border: none;
        }

    </style>



    <script>


        // =====================================================
        // COMPROBAR CARGA DEL GLB
        // =====================================================

        AFRAME.registerComponent(
            'control-modelo',
            {

                init: function () {

                    const modelo = this.el;


                    modelo.addEventListener(
                        'model-loaded',
                        function () {

                            console.log(
                                'Modelo GLB cargado correctamente'
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='ok'>" +
                                    "Modelo CAD: cargado correctamente" +
                                    "</span>";

                            }

                        }
                    );


                    modelo.addEventListener(
                        'model-error',
                        function (evento) {

                            console.error(
                                'Error cargando GLB:',
                                evento.detail
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='error'>" +
                                    "Modelo CAD: error al cargar" +
                                    "</span>";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // MOVIMIENTO PC
        //
        // W = adelante
        // S = atrás
        // A = izquierda
        // D = derecha
        //
        // E = subir
        // Q = bajar
        //
        // Mouse = mirar
        // =====================================================

        AFRAME.registerComponent(
            'movimiento-pc',
            {

                schema: {

                    velocidad: {
                        type: 'number',
                        default: 2
                    },


                    velocidadVertical: {
                        type: 'number',
                        default: 1.5
                    },


                    alturaMinima: {
                        type: 'number',
                        default: 0.25
                    },


                    alturaMaxima: {
                        type: 'number',
                        default: 5
                    }

                },


                init: function () {


                    this.teclas = {};


                    this.camara =
                        document.getElementById(
                            'camaraPrincipal'
                        );


                    this.keyDown =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = true;


                            if (

                                evento.code === 'KeyW' ||
                                evento.code === 'KeyA' ||
                                evento.code === 'KeyS' ||
                                evento.code === 'KeyD' ||
                                evento.code === 'KeyQ' ||
                                evento.code === 'KeyE'

                            ) {

                                evento.preventDefault();

                            }

                        };


                    this.keyUp =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = false;

                        };


                    window.addEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.addEventListener(
                        'keyup',
                        this.keyUp
                    );

                },


                tick: function (
                    tiempo,
                    deltaTime
                ) {


                    if (!deltaTime) {
                        return;
                    }


                    const escena =
                        this.el.sceneEl;



                    // =========================================
                    // NO USAR TECLADO DURANTE XR
                    // =========================================

                    if (

                        escena.is('vr-mode') ||
                        escena.is('ar-mode')

                    ) {

                        return;

                    }



                    if (!this.camara) {

                        return;

                    }


                    const dt =
                        deltaTime / 1000;


                    const rig =
                        this.el.object3D;



                    // =========================================
                    // ORIENTACIÓN DE LA CÁMARA
                    // =========================================

                    const quaternion =
                        new THREE.Quaternion();


                    this.camara.object3D
                        .getWorldQuaternion(
                            quaternion
                        );



                    // =========================================
                    // ADELANTE
                    // =========================================

                    const adelante =
                        new THREE.Vector3(
                            0,
                            0,
                            -1
                        );


                    adelante.applyQuaternion(
                        quaternion
                    );


                    adelante.y = 0;


                    if (
                        adelante.lengthSq() > 0
                    ) {

                        adelante.normalize();

                    }



                    // =========================================
                    // DERECHA
                    // =========================================

                    const derecha =
                        new THREE.Vector3(
                            1,
                            0,
                            0
                        );


                    derecha.applyQuaternion(
                        quaternion
                    );


                    derecha.y = 0;


                    if (
                        derecha.lengthSq() > 0
                    ) {

                        derecha.normalize();

                    }



                    // =========================================
                    // W
                    // =========================================

                    if (
                        this.teclas['KeyW']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // S
                    // =========================================

                    if (
                        this.teclas['KeyS']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // D
                    // =========================================

                    if (
                        this.teclas['KeyD']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // A
                    // =========================================

                    if (
                        this.teclas['KeyA']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // E = SUBIR
                    // =========================================

                    if (
                        this.teclas['KeyE']
                    ) {

                        rig.position.y +=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =========================================
                    // Q = BAJAR
                    // =========================================

                    if (
                        this.teclas['KeyQ']
                    ) {

                        rig.position.y -=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =========================================
                    // LÍMITES
                    // =========================================

                    rig.position.y =
                        THREE.MathUtils.clamp(

                            rig.position.y,

                            this.data
                                .alturaMinima,

                            this.data
                                .alturaMaxima

                        );

                },


                remove: function () {


                    window.removeEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.removeEventListener(
                        'keyup',
                        this.keyUp
                    );

                }

            }
        );



        // =====================================================
        // CORRECCIÓN DEL RIG PARA XR
        //
        // EN PC:
        // altura inicial = 1.6 m
        //
        // EN AR / VR:
        // dejamos que WebXR determine la posición física.
        // =====================================================

        AFRAME.registerComponent(
            'ajuste-rig-xr',
            {

                init: function () {


                    const rig =
                        this.el;


                    this.posicionAnterior =
                        new THREE.Vector3();



                    rig.sceneEl.addEventListener(
                        'enter-vr',
                        () => {


                            // Guardar posición PC.

                            this.posicionAnterior.copy(
                                rig.object3D.position
                            );


                            // En XR no usar el desplazamiento
                            // artificial del escritorio.

                            rig.object3D.position.set(
                                0,
                                0,
                                0
                            );

                        }
                    );



                    rig.sceneEl.addEventListener(
                        'exit-vr',
                        () => {


                            // Restaurar posición PC.

                            rig.object3D.position.copy(
                                this.posicionAnterior
                            );

                        }
                    );

                }

            }
        );



        // =====================================================
        // INTERFAZ DEL MODO AR
        //
        // IMPORTANTE:
        //
        // ESTE COMPONENTE NO MUEVE EL MODELO.
        //
        // SOLO CAMBIA MENSAJES Y OCULTA EL PANEL.
        //
        // TODA LA POSICIÓN AR LA MANEJA A-FRAME.
        // =====================================================

        AFRAME.registerComponent(
            'interfaz-ar',
            {

                init: function () {


                    const escena =
                        this.el;


                    const panel =
                        document.getElementById(
                            'overlay'
                        );


                    const texto =
                        document.getElementById(
                            'instruccionAR'
                        );



                    // =================================================
                    // ENTRAR EN AR
                    // =================================================

                    escena.addEventListener(
                        'enter-vr',
                        () => {


                            if (
                                !escena.is('ar-mode')
                            ) {

                                return;

                            }


                            if (panel) {

                                panel.style.display =
                                    'block';


                                panel.style.opacity =
                                    '1';


                                panel.classList.add(
                                    'modoAR'
                                );

                            }


                            if (texto) {

                                texto.innerHTML =
                                    "Mueve lentamente el teléfono." +
                                    "<br>" +
                                    "Busca una mesa o el piso.";

                            }

                        }
                    );



                    // =================================================
                    // HIT TEST COMENZÓ
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-start',
                        () => {


                            if (texto) {

                                texto.innerHTML =
                                    "Buscando superficie..." +
                                    "<br>" +
                                    "Mueve lentamente el teléfono.";

                            }

                        }
                    );



                    // =================================================
                    // SUPERFICIE DETECTADA
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-achieved',
                        () => {


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Superficie detectada." +
                                    "</span>" +
                                    "<br>" +
                                    "Toca la pantalla para " +
                                    "colocar el robot.";

                            }

                        }
                    );



                    // =================================================
                    // OBJETO COLOCADO
                    //
                    // A-FRAME YA HIZO EL TRABAJO.
                    // NO TOCAMOS LA POSICIÓN.
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-select',
                        () => {


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Robot colocado." +
                                    "</span>";

                            }



                            // =========================================
                            // OCULTAR PANEL
                            // =========================================

                            setTimeout(
                                () => {


                                    if (
                                        !escena.is(
                                            'ar-mode'
                                        )
                                    ) {

                                        return;

                                    }


                                    if (panel) {

                                        panel.style.opacity =
                                            '0';

                                    }


                                    setTimeout(
                                        () => {


                                            if (

                                                panel &&
                                                escena.is(
                                                    'ar-mode'
                                                )

                                            ) {

                                                panel.style.display =
                                                    'none';

                                            }

                                        },

                                        300
                                    );

                                },

                                700
                            );

                        }
                    );



                    // =================================================
                    // SALIR DE XR
                    // =================================================

                    escena.addEventListener(
                        'exit-vr',
                        () => {


                            if (panel) {

                                panel.style.display =
                                    'block';


                                panel.style.opacity =
                                    '1';


                                panel.classList.remove(
                                    'modoAR'
                                );

                            }


                            if (texto) {

                                texto.innerHTML =
                                    "En modo AR podrás colocar " +
                                    "el modelo sobre una superficie real.";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // COMPATIBILIDAD WEBXR
        // =====================================================

        async function comprobarXR() {


            const webxr =
                document.getElementById(
                    'estadoWebXR'
                );


            const vr =
                document.getElementById(
                    'estadoVR'
                );


            const ar =
                document.getElementById(
                    'estadoAR'
                );



            if (
                !navigator.xr
            ) {


                webxr.innerHTML =
                    'WebXR: no disponible';

                webxr.className =
                    'error';


                vr.innerHTML =
                    'VR: no disponible';

                vr.className =
                    'error';


                ar.innerHTML =
                    'AR: no disponible';

                ar.className =
                    'error';


                return;

            }



            webxr.innerHTML =
                'WebXR: disponible';

            webxr.className =
                'ok';



            // =================================================
            // VR
            // =================================================

            try {


                const soportaVR =
                    await navigator.xr
                        .isSessionSupported(
                            'immersive-vr'
                        );


                vr.innerHTML =
                    soportaVR
                    ?
                    'VR: compatible'
                    :
                    'VR: no compatible';


                vr.className =
                    soportaVR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                vr.innerHTML =
                    'VR: error';

                vr.className =
                    'error';

            }



            // =================================================
            // AR
            // =================================================

            try {


                const soportaAR =
                    await navigator.xr
                        .isSessionSupported(
                            'immersive-ar'
                        );


                ar.innerHTML =
                    soportaAR
                    ?
                    'AR: compatible'
                    :
                    'AR: no compatible';


                ar.className =
                    soportaAR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                ar.innerHTML =
                    'AR: error';

                ar.className =
                    'error';

            }

        }



        window.addEventListener(
            'load',
            comprobarXR
        );


    </script>

</head>



<body>



<!-- =========================================================
     PANEL
========================================================= -->

<div id="overlay">


    <div id="titulo">

        MODELO CAD INDUSTRIAL XR

    </div>



    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>



    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>



    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>



    <div
        id="estadoModelo"
        class="esperando">

        Modelo CAD: cargando...

    </div>



    <div id="controlesPC">

        <b>Controles PC</b>

        <br>

        W / S = adelante / atrás

        <br>

        A / D = izquierda / derecha

        <br>

        E = subir

        <br>

        Q = bajar / agacharse

        <br>

        Mouse = mirar

    </div>



    <div id="instruccionAR">

        En modo AR podrás colocar
        el modelo sobre una superficie real.

    </div>


</div>



<!-- =========================================================
     ESCENA
========================================================= -->

<a-scene


    xr-mode-ui="
        XRMode: xr
    "


    webxr="
        requiredFeatures: hit-test;
        optionalFeatures: dom-overlay;
        referenceSpaceType: local;
        overlayElement: #overlay;
    "


    ar-hit-test="
        target: #objetoXR;
        type: footprint;
    "


    interfaz-ar


    renderer="
        colorManagement: true;
        antialias: true;
        alpha: true;
    "
>



    <!-- =====================================================
         RECURSOS
    ====================================================== -->

    <a-assets timeout="30000">


        <a-asset-item

            id="modeloIndustrial"

            src="./models/modelo_industrial.glb">

        </a-asset-item>


    </a-assets>



    <!-- =====================================================
         ILUMINACIÓN
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="1">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="0.8"

        position="-3 5 3">

    </a-light>



    <!-- =====================================================
         MODELO INDUSTRIAL
         
         IMPORTANTE:
         
         "hide-on-enter-ar" es exactamente el mismo patrón
         que funcionó en prueba-ar.html.
         
         A-FRAME SE ENCARGA DE:
         
         - detectar superficie
         - retículo
         - colocación
         - seguimiento espacial
    ====================================================== -->

    <a-entity

        id="objetoXR"

        position="0 0 -3"

        hide-on-enter-ar
    >



        <!-- =================================================
             GLB

             Escala pequeña para visualizarlo
             como maqueta industrial.
        ================================================== -->

        <a-entity

            id="robotCAD"

            gltf-model="#modeloIndustrial"

            control-modelo

            position="0 0 0"

            rotation="0 90 0"

            scale="0.003 0.003 0.003">

        </a-entity>


    </a-entity>



    <!-- =====================================================
         PISO PC / VR
    ====================================================== -->

    <a-plane

        position="0 0 -3"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#78909C"

        hide-on-enter-ar>

    </a-plane>



    <!-- =====================================================
         CIELO PC / VR
    ====================================================== -->

    <a-sky

        color="#DCE6EA"

        hide-on-enter-ar>

    </a-sky>



    <!-- =====================================================
         RIG
    ====================================================== -->

    <a-entity

        id="rig"

        position="0 1.6 0"

        ajuste-rig-xr

        movimiento-pc="
            velocidad: 2;
            velocidadVertical: 1.5;
            alturaMinima: 0.25;
            alturaMaxima: 5;
        "
    >



        <a-camera

            id="camaraPrincipal"

            position="0 0 0"

            look-controls>

        </a-camera>


    </a-entity>



</a-scene>



</body>

</html>
