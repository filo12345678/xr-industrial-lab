<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Laboratorio XR - Modelo CAD Industrial</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        #overlay {

            position: fixed;

            top: 15px;

            left: 15px;

            width: 310px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;

            pointer-events: none;
        }


        #titulo {

            color: #00ff88;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .ok {
            color: #00ff88;
        }


        .error {
            color: #ff5555;
        }


        .esperando {
            color: #ffcc00;
        }


        #estadoModelo {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }


        #controlesPC {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }


        #instruccionAR {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }

    </style>



    <script>


        // =====================================================
        // CONTROL DE CARGA DEL MODELO GLB
        // =====================================================

        AFRAME.registerComponent(
            'control-modelo',
            {

                init: function () {

                    const modelo = this.el;


                    modelo.addEventListener(
                        'model-loaded',
                        function () {

                            console.log(
                                'Modelo GLB cargado correctamente'
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='ok'>" +
                                    "Modelo CAD: cargado correctamente" +
                                    "</span>";

                            }

                        }
                    );


                    modelo.addEventListener(
                        'model-error',
                        function (evento) {

                            console.error(
                                'Error cargando modelo GLB:',
                                evento.detail
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='error'>" +
                                    "Modelo CAD: error al cargar" +
                                    "</span>";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // OCULTAR OBJETOS EN MODO AR
        //
        // Se usa para ocultar:
        //
        // - piso virtual
        // - cielo virtual
        //
        // y permitir ver el mundo real.
        // =====================================================

        AFRAME.registerComponent(
            'ocultar-en-ar',
            {

                init: function () {

                    const elemento =
                        this.el;


                    const escena =
                        elemento.sceneEl;


                    escena.addEventListener(
                        'enter-vr',
                        function () {

                            if (
                                escena.is('ar-mode')
                            ) {

                                elemento.setAttribute(
                                    'visible',
                                    false
                                );

                            }

                        }
                    );


                    escena.addEventListener(
                        'exit-vr',
                        function () {

                            elemento.setAttribute(
                                'visible',
                                true
                            );

                        }
                    );

                }

            }
        );



        // =====================================================
        // MOVIMIENTO COMPLETO EN PC
        //
        // W = adelante
        // S = atrás
        // A = izquierda
        // D = derecha
        //
        // E = subir
        // Q = bajar
        //
        // Mouse = mirar
        // =====================================================

        AFRAME.registerComponent(
            'movimiento-pc',
            {

                schema: {

                    velocidad: {

                        type: 'number',

                        default: 2.0
                    },


                    velocidadVertical: {

                        type: 'number',

                        default: 1.5
                    },


                    alturaMinima: {

                        type: 'number',

                        default: 0.25
                    },


                    alturaMaxima: {

                        type: 'number',

                        default: 5
                    }

                },


                init: function () {


                    // =========================================
                    // REGISTRO DE TECLAS
                    // =========================================

                    this.teclas = {};


                    // Cámara principal.

                    this.camara =
                        document.getElementById(
                            'camaraPrincipal'
                        );



                    // =========================================
                    // TECLA PRESIONADA
                    // =========================================

                    this.keyDown =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = true;



                            if (

                                evento.code === 'KeyW' ||

                                evento.code === 'KeyA' ||

                                evento.code === 'KeyS' ||

                                evento.code === 'KeyD' ||

                                evento.code === 'KeyQ' ||

                                evento.code === 'KeyE'

                            ) {

                                evento.preventDefault();

                            }

                        };



                    // =========================================
                    // TECLA SOLTADA
                    // =========================================

                    this.keyUp =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = false;

                        };



                    window.addEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.addEventListener(
                        'keyup',
                        this.keyUp
                    );

                },



                tick: function (
                    tiempo,
                    deltaTime
                ) {


                    if (!deltaTime) {

                        return;

                    }


                    const escena =
                        this.el.sceneEl;



                    // =========================================
                    // EN VR / AR NO USAR TECLADO
                    //
                    // La posición viene del dispositivo XR.
                    // =========================================

                    if (

                        escena.is('vr-mode') ||

                        escena.is('ar-mode')

                    ) {

                        return;

                    }



                    if (!this.camara) {

                        return;

                    }



                    const dt =
                        deltaTime / 1000;



                    const rig =
                        this.el.object3D;



                    // =========================================
                    // OBTENER DIRECCIÓN DE LA CÁMARA
                    // =========================================

                    const quaternion =
                        new THREE.Quaternion();


                    this.camara.object3D
                        .getWorldQuaternion(
                            quaternion
                        );



                    // =========================================
                    // VECTOR HACIA ADELANTE
                    // =========================================

                    const adelante =
                        new THREE.Vector3(
                            0,
                            0,
                            -1
                        );


                    adelante.applyQuaternion(
                        quaternion
                    );


                    /*
                    Eliminamos componente vertical.

                    Así mirar hacia arriba y presionar W
                    NO hace que la cámara vuele.
                    */

                    adelante.y = 0;


                    if (
                        adelante.lengthSq() > 0
                    ) {

                        adelante.normalize();

                    }



                    // =========================================
                    // VECTOR HACIA LA DERECHA
                    // =========================================

                    const derecha =
                        new THREE.Vector3(
                            1,
                            0,
                            0
                        );


                    derecha.applyQuaternion(
                        quaternion
                    );


                    derecha.y = 0;


                    if (
                        derecha.lengthSq() > 0
                    ) {

                        derecha.normalize();

                    }



                    // =========================================
                    // W = ADELANTE
                    // =========================================

                    if (
                        this.teclas['KeyW']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // S = ATRÁS
                    // =========================================

                    if (
                        this.teclas['KeyS']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // D = DERECHA
                    // =========================================

                    if (
                        this.teclas['KeyD']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // A = IZQUIERDA
                    // =========================================

                    if (
                        this.teclas['KeyA']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // E = SUBIR
                    // =========================================

                    if (
                        this.teclas['KeyE']
                    ) {

                        rig.position.y +=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =========================================
                    // Q = BAJAR / AGACHARSE
                    // =========================================

                    if (
                        this.teclas['KeyQ']
                    ) {

                        rig.position.y -=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =========================================
                    // LIMITAR ALTURA
                    // =========================================

                    rig.position.y =
                        THREE.MathUtils.clamp(

                            rig.position.y,

                            this.data
                                .alturaMinima,

                            this.data
                                .alturaMaxima

                        );

                },



                remove: function () {


                    window.removeEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.removeEventListener(
                        'keyup',
                        this.keyUp
                    );

                }

            }
        );



        // =====================================================
        // COLOCACIÓN FIJA DEL MODELO EN AR
        //
        // WebXR mueve solamente un marcador.
        //
        // Cuando tocamos:
        //
        // marcador
        //    ↓
        // posición
        //    ↓
        // robot
        //
        // Después el robot NO vuelve a moverse.
        // =====================================================

        AFRAME.registerComponent(
            'colocacion-fija-ar',
            {

                init: function () {


                    const escena =
                        this.el;



                    this.modelo =
                        document.getElementById(
                            'objetoXR'
                        );


                    this.punto =
                        document.getElementById(
                            'puntoColocacionAR'
                        );


                    this.colocado =
                        false;



                    // =================================================
                    // ENTRAR EN AR
                    // =================================================

                    escena.addEventListener(
                        'enter-vr',
                        () => {


                            if (
                                !escena.is('ar-mode')
                            ) {

                                return;

                            }



                            this.colocado =
                                false;



                            // Ocultar modelo.

                            this.modelo.setAttribute(
                                'visible',
                                false
                            );


                            // Mostrar marcador.

                            this.punto.setAttribute(
                                'visible',
                                true
                            );



                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "Mueve lentamente el teléfono." +
                                    "<br>" +
                                    "Apunta a una mesa o al piso.";

                            }

                        }
                    );



                    // =================================================
                    // HIT TEST INICIADO
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-start',
                        () => {


                            if (
                                this.colocado
                            ) {

                                return;

                            }


                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "Buscando superficie..." +
                                    "<br>" +
                                    "Mueve lentamente el dispositivo.";

                            }

                        }
                    );



                    // =================================================
                    // SUPERFICIE ENCONTRADA
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-achieved',
                        () => {


                            if (
                                this.colocado
                            ) {

                                return;

                            }


                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Superficie detectada." +
                                    "</span>" +
                                    "<br>" +
                                    "Toca la pantalla una vez " +
                                    "para colocar el robot.";

                            }

                        }
                    );



                    // =================================================
                    // TOCAR PARA FIJAR
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-select',
                        () => {


                            if (
                                this.colocado
                            ) {

                                return;

                            }


                            if (
                                !escena.is('ar-mode')
                            ) {

                                return;

                            }



                            requestAnimationFrame(
                                () => {


                                    // =================================
                                    // OBTENER POSICIÓN DEL HIT TEST
                                    // =================================

                                    const posicion =
                                        new THREE.Vector3();


                                    this.punto.object3D
                                        .getWorldPosition(
                                            posicion
                                        );



                                    // =================================
                                    // COLOCAR ROBOT
                                    // =================================

                                    this.modelo.object3D
                                        .position
                                        .copy(
                                            posicion
                                        );



                                    /*
                                    NO copiamos la orientación
                                    del Hit Test.

                                    Así el robot permanece vertical.
                                    */



                                    this.modelo.setAttribute(
                                        'visible',
                                        true
                                    );



                                    // Ocultar marcador.

                                    this.punto.setAttribute(
                                        'visible',
                                        false
                                    );



                                    // Bloquear ubicación.

                                    this.colocado =
                                        true;



                                    const texto =
                                        document.getElementById(
                                            'instruccionAR'
                                        );


                                    if (texto) {

                                        texto.innerHTML =
                                            "<span class='ok'>" +
                                            "Robot colocado y fijado." +
                                            "</span>" +
                                            "<br>" +
                                            "Ahora camina alrededor " +
                                            "para observar todas sus caras.";

                                    }

                                }
                            );

                        }
                    );



                    // =================================================
                    // SALIR DE AR
                    // =================================================

                    escena.addEventListener(
                        'exit-vr',
                        () => {


                            this.colocado =
                                false;



                            // Restaurar posición PC.

                            this.modelo.setAttribute(
                                'position',
                                '0 0 -3'
                            );


                            this.modelo.setAttribute(
                                'visible',
                                true
                            );



                            // Restaurar marcador.

                            this.punto.setAttribute(
                                'position',
                                '0 -100 0'
                            );


                            this.punto.setAttribute(
                                'visible',
                                true
                            );



                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "En AR podrás colocar el " +
                                    "modelo sobre una superficie real.";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // COMPROBAR WEBXR
        // =====================================================

        async function comprobarXR() {


            const webxr =
                document.getElementById(
                    'estadoWebXR'
                );


            const vr =
                document.getElementById(
                    'estadoVR'
                );


            const ar =
                document.getElementById(
                    'estadoAR'
                );



            // =================================================
            // WEBXR
            // =================================================

            if (
                !navigator.xr
            ) {


                webxr.innerHTML =
                    'WebXR: no disponible';

                webxr.className =
                    'error';


                vr.innerHTML =
                    'VR: no disponible';

                vr.className =
                    'error';


                ar.innerHTML =
                    'AR: no disponible';

                ar.className =
                    'error';


                return;

            }



            webxr.innerHTML =
                'WebXR: disponible';

            webxr.className =
                'ok';



            // =================================================
            // VR
            // =================================================

            try {


                const soportaVR =

                    await navigator.xr
                        .isSessionSupported(
                            'immersive-vr'
                        );


                vr.innerHTML =

                    soportaVR
                    ?
                    'VR: compatible'
                    :
                    'VR: no compatible';


                vr.className =

                    soportaVR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                vr.innerHTML =
                    'VR: error';


                vr.className =
                    'error';

            }



            // =================================================
            // AR
            // =================================================

            try {


                const soportaAR =

                    await navigator.xr
                        .isSessionSupported(
                            'immersive-ar'
                        );


                ar.innerHTML =

                    soportaAR
                    ?
                    'AR: compatible'
                    :
                    'AR: no compatible';


                ar.className =

                    soportaAR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                ar.innerHTML =
                    'AR: error';


                ar.className =
                    'error';

            }

        }



        window.addEventListener(
            'load',
            comprobarXR
        );


    </script>

</head>



<body>



<!-- =========================================================
     PANEL DE INFORMACIÓN
========================================================= -->

<div id="overlay">


    <div id="titulo">

        MODELO CAD INDUSTRIAL XR

    </div>



    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>



    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>



    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>



    <div
        id="estadoModelo"
        class="esperando">

        Modelo CAD: cargando...

    </div>



    <!-- =====================================================
         CONTROLES PC
    ====================================================== -->

    <div id="controlesPC">

        <b>Controles PC</b>

        <br>

        W / S = adelante / atrás

        <br>

        A / D = izquierda / derecha

        <br>

        E = subir

        <br>

        Q = bajar / agacharse

        <br>

        Mouse = mirar

    </div>



    <div id="instruccionAR">

        En modo AR podrás colocar
        el modelo sobre una superficie real.

    </div>


</div>



<!-- =========================================================
     ESCENA PRINCIPAL
========================================================= -->

<a-scene


    xr-mode-ui="
        XRMode: xr
    "


    webxr="
        optionalFeatures: hit-test, dom-overlay;
        referenceSpaceType: local;
        overlayElement: #overlay;
    "


    ar-hit-test="
        target: #puntoColocacionAR;
        type: footprint;
    "


    colocacion-fija-ar


    renderer="
        colorManagement: true;
        antialias: true;
        alpha: true;
    "


    background="
        color: #DCE6EA;
        transparent: true;
    "
>



    <!-- =====================================================
         ARCHIVOS
    ====================================================== -->

    <a-assets timeout="30000">


        <!--
        MODELO CAD

        Ruta:

        xr-industrial-lab/
        └── models/
            └── modelo_industrial.glb
        -->

        <a-asset-item

            id="modeloIndustrial"

            src="./models/modelo_industrial.glb">

        </a-asset-item>


    </a-assets>



    <!-- =====================================================
         ILUMINACIÓN
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="1">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="1"

        position="-3 5 3">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="0.5"

        position="4 3 -4">

    </a-light>



    <!-- =====================================================
         MARCADOR HIT TEST

         Este círculo será movido por WebXR
         mientras buscamos una superficie.
    ====================================================== -->

    <a-ring

        id="puntoColocacionAR"

        position="0 -100 0"

        rotation="-90 0 0"

        radius-inner="0.12"

        radius-outer="0.18"

        color="#00FF88"

        material="
            transparent: true;
            opacity: 0.8;
            side: double;
        ">

    </a-ring>



    <!-- =====================================================
         CONTENEDOR DEL MODELO
    ====================================================== -->

    <a-entity

        id="objetoXR"

        position="0 0 -3"

        rotation="0 0 0"

        visible="true"
    >



        <!-- =================================================
             MODELO CAD

             Vista inicial lateral:

             rotation="0 90 0"

             Si quieres ver el otro lateral:
             
             rotation="0 -90 0"
        ================================================== -->

        <a-entity

            id="robotCAD"

            gltf-model="#modeloIndustrial"

            control-modelo

            position="0 0 0"

            rotation="0 90 0"

            scale="0.01 0.01 0.01"

            shadow="
                cast: true;
                receive: true;
            ">

        </a-entity>


    </a-entity>



    <!-- =====================================================
         PISO PC / VR
    ====================================================== -->

    <a-plane

        ocultar-en-ar

        position="0 0 -3"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#78909C"

        shadow="
            receive: true;
        ">

    </a-plane>



    <!-- =====================================================
         CIELO PC / VR
    ====================================================== -->

    <a-sky

        ocultar-en-ar

        color="#DCE6EA">

    </a-sky>



    <!-- =====================================================
         RIG DEL USUARIO
         
         Este objeto contiene la cámara.

         En PC:
         nosotros movemos este elemento.

         En XR:
         WebXR controla la pose del visor.
    ====================================================== -->

    <a-entity

        id="rig"

        position="0 1.6 0"

        movimiento-pc="
            velocidad: 2.0;
            velocidadVertical: 1.5;
            alturaMinima: 0.25;
            alturaMaxima: 5;
        "
    >



        <!-- =================================================
             CÁMARA
             
             IMPORTANTE:
             YA NO UTILIZAMOS wasd-controls.
             
             Nuestro componente movimiento-pc
             maneja todas las teclas.
        ================================================== -->

        <a-camera

            id="camaraPrincipal"

            position="0 0 0"

            look-controls>

        </a-camera>


    </a-entity>



</a-scene>



</body>

</html>
