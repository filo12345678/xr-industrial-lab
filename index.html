<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Laboratorio XR - Modelo CAD Industrial</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #overlay {

            position: fixed;

            top: 15px;
            left: 15px;

            width: 300px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.72);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;

            pointer-events: none;
        }

        #titulo {

            color: #00ff88;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .ok {
            color: #00ff88;
        }

        .error {
            color: #ff5555;
        }

        .esperando {
            color: #ffcc00;
        }

        #estadoModelo {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }

        #instruccionAR {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;

            color: white;
        }

    </style>



    <script>

        // =====================================================
        // OCULTAR ELEMENTOS CUANDO SE ENTRA EN AR
        //
        // Se utiliza para esconder:
        // - cielo
        // - piso virtual
        //
        // En AR queremos ver el mundo real.
        // =====================================================

        AFRAME.registerComponent(
            'ocultar-en-ar',
            {

                init: function () {

                    const elemento = this.el;
                    const escena = elemento.sceneEl;


                    escena.addEventListener(
                        'enter-vr',
                        function () {

                            if (escena.is('ar-mode')) {

                                elemento.setAttribute(
                                    'visible',
                                    false
                                );

                            }

                        }
                    );


                    escena.addEventListener(
                        'exit-vr',
                        function () {

                            elemento.setAttribute(
                                'visible',
                                true
                            );

                        }
                    );

                }

            }
        );



        // =====================================================
        // ESTADO DEL MODELO GLB
        // =====================================================

        AFRAME.registerComponent(
            'estado-modelo',
            {

                init: function () {

                    const elemento = this.el;


                    elemento.addEventListener(
                        'model-loaded',
                        function () {

                            console.log(
                                "Modelo GLB cargado correctamente."
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='ok'>" +
                                    "Modelo CAD: cargado correctamente" +
                                    "</span>";

                            }

                        }
                    );


                    elemento.addEventListener(
                        'model-error',
                        function (evento) {

                            console.error(
                                "Error cargando GLB:",
                                evento.detail
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='error'>" +
                                    "Modelo CAD: error al cargar" +
                                    "</span>";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // ESTADO DEL HIT TEST
        // =====================================================

        AFRAME.registerComponent(
            'estado-hit-test',
            {

                init: function () {

                    const escena = this.el;


                    // -------------------------------------------------
                    // Se inició la búsqueda de superficies
                    // -------------------------------------------------

                    escena.addEventListener(
                        'ar-hit-test-start',
                        function () {

                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "Buscando superficies..." +
                                    "<br>" +
                                    "Mueve lentamente el dispositivo.";

                            }

                        }
                    );


                    // -------------------------------------------------
                    // Se encontró una superficie
                    // -------------------------------------------------

                    escena.addEventListener(
                        'ar-hit-test-achieved',
                        function () {

                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Superficie detectada." +
                                    "</span>" +
                                    "<br>" +
                                    "Toca la pantalla para colocar " +
                                    "el modelo CAD.";

                            }

                        }
                    );


                    // -------------------------------------------------
                    // Se colocó el modelo
                    // -------------------------------------------------

                    escena.addEventListener(
                        'ar-hit-test-select',
                        function () {

                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Modelo colocado correctamente." +
                                    "</span>" +
                                    "<br>" +
                                    "Puedes buscar otra superficie " +
                                    "y tocar nuevamente para moverlo.";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // DETECCIÓN DE COMPATIBILIDAD WEBXR
        // =====================================================

        async function detectarCompatibilidadXR() {

            const estadoWebXR =
                document.getElementById(
                    "estadoWebXR"
                );

            const estadoVR =
                document.getElementById(
                    "estadoVR"
                );

            const estadoAR =
                document.getElementById(
                    "estadoAR"
                );


            // -------------------------------------------------
            // WEBXR
            // -------------------------------------------------

            if (!navigator.xr) {

                estadoWebXR.innerHTML =
                    "WebXR: no disponible";

                estadoWebXR.className =
                    "error";


                estadoVR.innerHTML =
                    "VR: no disponible";

                estadoVR.className =
                    "error";


                estadoAR.innerHTML =
                    "AR: no disponible";

                estadoAR.className =
                    "error";


                return;

            }


            estadoWebXR.innerHTML =
                "WebXR: disponible";

            estadoWebXR.className =
                "ok";


            // -------------------------------------------------
            // VR
            // -------------------------------------------------

            try {

                const soportaVR =
                    await navigator.xr.isSessionSupported(
                        "immersive-vr"
                    );


                if (soportaVR) {

                    estadoVR.innerHTML =
                        "VR: compatible";

                    estadoVR.className =
                        "ok";

                }

                else {

                    estadoVR.innerHTML =
                        "VR: no compatible";

                    estadoVR.className =
                        "error";

                }

            }

            catch (error) {

                estadoVR.innerHTML =
                    "VR: error";

                estadoVR.className =
                    "error";

            }


            // -------------------------------------------------
            // AR
            // -------------------------------------------------

            try {

                const soportaAR =
                    await navigator.xr.isSessionSupported(
                        "immersive-ar"
                    );


                if (soportaAR) {

                    estadoAR.innerHTML =
                        "AR: compatible";

                    estadoAR.className =
                        "ok";

                }

                else {

                    estadoAR.innerHTML =
                        "AR: no compatible";

                    estadoAR.className =
                        "error";

                }

            }

            catch (error) {

                estadoAR.innerHTML =
                    "AR: error";

                estadoAR.className =
                    "error";

            }

        }


        window.addEventListener(
            "load",
            detectarCompatibilidadXR
        );

    </script>

</head>



<body>


<!-- =========================================================
     PANEL DE INFORMACIÓN
========================================================= -->

<div id="overlay">

    <div id="titulo">
        MODELO CAD INDUSTRIAL XR
    </div>


    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>


    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>


    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>


    <div
        id="estadoModelo"
        class="esperando">

        Modelo CAD: cargando...

    </div>


    <div id="instruccionAR">

        En AR podrás colocar el modelo CAD
        sobre una superficie real.

    </div>

</div>



<!-- =========================================================
     ESCENA A-FRAME
========================================================= -->

<a-scene

    xr-mode-ui="
        XRMode: xr
    "

    webxr="
        referenceSpaceType: local;
        optionalFeatures: hit-test, dom-overlay;
        overlayElement: #overlay;
    "

    ar-hit-test="
        target: #objetoXR;
        type: footprint;
    "

    estado-hit-test

    renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
        alpha: true;
        antialias: true;
    "

    background="
        color: #DCE6EA;
        transparent: true;
    "
>


    <!-- =====================================================
         RECURSOS
    ====================================================== -->

    <a-assets>

        <!--
        IMPORTANTE:

        El nombre debe coincidir EXACTAMENTE
        con el archivo que subiste a GitHub.

        Ejemplo actual:

        models/robot_industrial.glb
        -->

        <a-asset-item

            id="modeloIndustrial"

            src="models/robot_industrial.glb">

        </a-asset-item>

    </a-assets>



    <!-- =====================================================
         ILUMINACIÓN
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="1.0">

    </a-light>


    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="1.0"

        position="-2 4 3">

    </a-light>


    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="0.5"

        position="3 2 -3">

    </a-light>



    <!-- =====================================================
         CONTENEDOR DEL MODELO

         IMPORTANTE:
         El Hit Test mueve ESTE elemento.

         El modelo GLB está dentro de él.
    ====================================================== -->

    <a-entity

        id="objetoXR"

        position="0 0 -3"

        rotation="0 0 0"

        scale="1 1 1"
    >


        <!-- =================================================
             MODELO CAD
             
             Aquí ajustaremos:
             - escala
             - rotación
             - altura

             sin afectar el Hit Test.
        ================================================== -->

        <a-entity

            id="robotCAD"

            gltf-model="#modeloIndustrial"

            estado-modelo

            position="0 0 0"

            rotation="0 0 0"

            scale="0.01 0.01 0.01"

            shadow="cast: true; receive: true">

        </a-entity>


    </a-entity>



    <!-- =====================================================
         PISO PARA PC / VR

         Se oculta cuando entramos en AR.
    ====================================================== -->

    <a-plane

        ocultar-en-ar

        position="0 0 -3"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#78909C"

        material="
            roughness: 0.9;
        "

        shadow="receive: true">

    </a-plane>



    <!-- =====================================================
         CIELO PARA PC / VR

         Se oculta en AR.
    ====================================================== -->

    <a-sky

        ocultar-en-ar

        color="#DCE6EA">

    </a-sky>



    <!-- =====================================================
         CÁMARA
    ====================================================== -->

    <a-entity

        id="rig"

        position="0 1.6 0"
    >

        <a-camera

            look-controls

            wasd-controls>

        </a-camera>

    </a-entity>


</a-scene>


</body>

</html>
