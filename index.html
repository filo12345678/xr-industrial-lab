<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Laboratorio XR - Modelo CAD Industrial</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        #overlay {

            position: fixed;

            top: 15px;
            left: 15px;

            width: 300px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;

            pointer-events: none;
        }


        #titulo {

            color: #00ff88;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .ok {

            color: #00ff88;
        }


        .error {

            color: #ff5555;
        }


        .esperando {

            color: #ffcc00;
        }


        #estadoModelo,
        #controlesPC {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }

    </style>



    <script>


        // =====================================================
        // COMPROBAR CARGA DEL MODELO
        // =====================================================

        AFRAME.registerComponent(
            'control-modelo',
            {

                init: function () {

                    const modelo = this.el;


                    modelo.addEventListener(
                        'model-loaded',
                        function () {

                            console.log(
                                'Modelo GLB cargado correctamente.'
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='ok'>" +
                                    "Modelo CAD: cargado correctamente" +
                                    "</span>";

                            }

                        }
                    );


                    modelo.addEventListener(
                        'model-error',
                        function (evento) {

                            console.error(
                                'Error cargando GLB:',
                                evento.detail
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='error'>" +
                                    "Modelo CAD: error al cargar" +
                                    "</span>";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // MOVIMIENTO COMPLETO PARA PC
        //
        // W = adelante
        // S = atrás
        // A = izquierda
        // D = derecha
        //
        // E = subir
        // Q = bajar
        //
        // Mouse = mirar
        // =====================================================

        AFRAME.registerComponent(
            'movimiento-pc',
            {

                schema: {

                    velocidad: {

                        type: 'number',

                        default: 2
                    },


                    velocidadVertical: {

                        type: 'number',

                        default: 1.5
                    },


                    alturaMinima: {

                        type: 'number',

                        default: -1.35
                    },


                    alturaMaxima: {

                        type: 'number',

                        default: 3.4
                    }

                },


                init: function () {


                    this.teclas = {};


                    this.camara =
                        document.getElementById(
                            'camaraPrincipal'
                        );


                    this.keyDown =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = true;


                            if (

                                evento.code === 'KeyW' ||
                                evento.code === 'KeyA' ||
                                evento.code === 'KeyS' ||
                                evento.code === 'KeyD' ||
                                evento.code === 'KeyQ' ||
                                evento.code === 'KeyE'

                            ) {

                                evento.preventDefault();

                            }

                        };


                    this.keyUp =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = false;

                        };


                    window.addEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.addEventListener(
                        'keyup',
                        this.keyUp
                    );

                },


                tick: function (
                    tiempo,
                    deltaTime
                ) {


                    if (!deltaTime) {

                        return;

                    }


                    const escena =
                        this.el.sceneEl;



                    // =========================================
                    // NO MOVER EL RIG MEDIANTE TECLADO EN XR
                    // =========================================

                    if (

                        escena.is('vr-mode') ||
                        escena.is('ar-mode')

                    ) {

                        return;

                    }



                    if (!this.camara) {

                        return;

                    }


                    const dt =
                        deltaTime / 1000;


                    const rig =
                        this.el.object3D;



                    // =========================================
                    // ORIENTACIÓN DE LA CÁMARA
                    // =========================================

                    const quaternion =
                        new THREE.Quaternion();


                    this.camara.object3D
                        .getWorldQuaternion(
                            quaternion
                        );



                    // =========================================
                    // DIRECCIÓN ADELANTE
                    // =========================================

                    const adelante =
                        new THREE.Vector3(
                            0,
                            0,
                            -1
                        );


                    adelante.applyQuaternion(
                        quaternion
                    );


                    adelante.y = 0;


                    if (
                        adelante.lengthSq() > 0
                    ) {

                        adelante.normalize();

                    }



                    // =========================================
                    // DIRECCIÓN DERECHA
                    // =========================================

                    const derecha =
                        new THREE.Vector3(
                            1,
                            0,
                            0
                        );


                    derecha.applyQuaternion(
                        quaternion
                    );


                    derecha.y = 0;


                    if (
                        derecha.lengthSq() > 0
                    ) {

                        derecha.normalize();

                    }



                    // =========================================
                    // W
                    // =========================================

                    if (
                        this.teclas['KeyW']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // S
                    // =========================================

                    if (
                        this.teclas['KeyS']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // D
                    // =========================================

                    if (
                        this.teclas['KeyD']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // A
                    // =========================================

                    if (
                        this.teclas['KeyA']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // E = SUBIR
                    // =========================================

                    if (
                        this.teclas['KeyE']
                    ) {

                        rig.position.y +=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =========================================
                    // Q = BAJAR
                    // =========================================

                    if (
                        this.teclas['KeyQ']
                    ) {

                        rig.position.y -=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =========================================
                    // LIMITAR ALTURA
                    // =========================================

                    rig.position.y =
                        THREE.MathUtils.clamp(

                            rig.position.y,

                            this.data
                                .alturaMinima,

                            this.data
                                .alturaMaxima

                        );

                },


                remove: function () {


                    window.removeEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.removeEventListener(
                        'keyup',
                        this.keyUp
                    );

                }

            }
        );



        // =====================================================
        // COMPROBAR COMPATIBILIDAD WEBXR
        // =====================================================

        async function comprobarXR() {


            const webxr =
                document.getElementById(
                    'estadoWebXR'
                );


            const vr =
                document.getElementById(
                    'estadoVR'
                );


            const ar =
                document.getElementById(
                    'estadoAR'
                );



            if (!navigator.xr) {


                webxr.innerHTML =
                    'WebXR: no disponible';

                webxr.className =
                    'error';


                vr.innerHTML =
                    'VR: no disponible';

                vr.className =
                    'error';


                ar.innerHTML =
                    'AR: no disponible';

                ar.className =
                    'error';


                return;

            }



            webxr.innerHTML =
                'WebXR: disponible';

            webxr.className =
                'ok';



            // =================================================
            // VR
            // =================================================

            try {


                const soportaVR =
                    await navigator.xr
                        .isSessionSupported(
                            'immersive-vr'
                        );


                vr.innerHTML =
                    soportaVR
                    ?
                    'VR: compatible'
                    :
                    'VR: no compatible';


                vr.className =
                    soportaVR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                vr.innerHTML =
                    'VR: error';

                vr.className =
                    'error';

            }



            // =================================================
            // AR
            // =================================================

            try {


                const soportaAR =
                    await navigator.xr
                        .isSessionSupported(
                            'immersive-ar'
                        );


                ar.innerHTML =
                    soportaAR
                    ?
                    'AR: compatible'
                    :
                    'AR: no compatible';


                ar.className =
                    soportaAR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                ar.innerHTML =
                    'AR: error';

                ar.className =
                    'error';

            }

        }



        window.addEventListener(
            'load',
            comprobarXR
        );


    </script>

</head>



<body>



<!-- =========================================================
     PANEL NORMAL
     
     IMPORTANTE:
     
     YA NO SE MODIFICA DURANTE AR.
     NO SE OCULTA.
     NO SE CAMBIA.
     NO HAY setTimeout.
     NO HAY dom-overlay.
========================================================= -->

<div id="overlay">


    <div id="titulo">

        MODELO CAD INDUSTRIAL XR

    </div>



    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>



    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>



    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>



    <div
        id="estadoModelo"
        class="esperando">

        Modelo CAD: cargando...

    </div>



    <div id="controlesPC">

        <b>Controles PC</b>

        <br>

        W / S = adelante / atrás

        <br>

        A / D = izquierda / derecha

        <br>

        E = subir

        <br>

        Q = bajar / agacharse

        <br>

        Mouse = mirar

    </div>


</div>



<!-- =========================================================
     ESCENA
========================================================= -->

<a-scene


    xr-mode-ui="
        XRMode: xr
    "


    webxr="
        requiredFeatures: hit-test;
        referenceSpaceType: local;
    "


    ar-hit-test="
        target: #objetoXR;
        type: footprint;
    "


    renderer="
        colorManagement: true;
        alpha: true;
    "
>



    <!-- =====================================================
         RECURSOS
    ====================================================== -->

    <a-assets timeout="30000">


        <a-asset-item

            id="modeloIndustrial"

            src="./models/modelo_industrial.glb">

        </a-asset-item>


    </a-assets>



    <!-- =====================================================
         ILUMINACIÓN
         
         Dejamos solo dos luces para reducir carga.
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="1">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="0.8"

        position="-3 5 3">

    </a-light>



    <!-- =====================================================
         CAD
         
         MISMO MÉTODO QUE EL CUBO QUE FUNCIONÓ.
    ====================================================== -->

    <a-entity

        id="objetoXR"

        position="0 0 -3"

        hide-on-enter-ar
    >



        <a-entity

            id="robotCAD"

            gltf-model="#modeloIndustrial"

            control-modelo

            position="0 0 0"

            rotation="0 90 0"

            scale="0.003 0.003 0.003">

        </a-entity>


    </a-entity>



    <!-- =====================================================
         PISO
    ====================================================== -->

    <a-plane

        position="0 0 -3"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#78909C"

        hide-on-enter-ar>

    </a-plane>



    <!-- =====================================================
         CIELO
    ====================================================== -->

    <a-sky

        color="#DCE6EA"

        hide-on-enter-ar>

    </a-sky>



    <!-- =====================================================
         RIG

         En lugar de comenzar el RIG a 1.6 m,
         dejamos el RIG en cero.

         La cámara de PC es la que comienza a 1.6 m.

         Esto es importante porque el padre de la cámara
         no introduce un desplazamiento adicional en XR.
    ====================================================== -->

    <a-entity

        id="rig"

        position="0 0 0"

        movimiento-pc="
            velocidad: 2;
            velocidadVertical: 1.5;
            alturaMinima: -1.35;
            alturaMaxima: 3.4;
        "
    >



        <a-camera

            id="camaraPrincipal"

            position="0 1.6 0"

            look-controls>

        </a-camera>


    </a-entity>



</a-scene>



</body>

</html>
