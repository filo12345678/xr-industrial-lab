<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Laboratorio XR - Modelo CAD Industrial</title>

    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        #overlay {

            position: fixed;

            top: 15px;
            left: 15px;

            width: 310px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;

            pointer-events: none;

            transition: opacity 0.3s ease;
        }


        #titulo {

            color: #00ff88;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .ok {
            color: #00ff88;
        }


        .error {
            color: #ff5555;
        }


        .esperando {
            color: #ffcc00;
        }


        #estadoModelo,
        #controlesPC,
        #instruccionAR {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }


        /* ==================================================
           PANEL COMPACTO EN AR
        ================================================== */

        #overlay.modoAR {

            width: 260px;

            background: rgba(0, 0, 0, 0.65);
        }


        #overlay.modoAR #titulo,
        #overlay.modoAR #estadoWebXR,
        #overlay.modoAR #estadoVR,
        #overlay.modoAR #estadoAR,
        #overlay.modoAR #estadoModelo,
        #overlay.modoAR #controlesPC {

            display: none;
        }


        #overlay.modoAR #instruccionAR {

            margin: 0;

            padding: 0;

            border: none;

            font-size: 14px;
        }

    </style>



    <script>


        // =====================================================
        // CONTROL DE CARGA DEL MODELO GLB
        // =====================================================

        AFRAME.registerComponent(
            'control-modelo',
            {

                init: function () {

                    const modelo = this.el;


                    modelo.addEventListener(
                        'model-loaded',
                        function () {

                            console.log(
                                'Modelo GLB cargado correctamente'
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='ok'>" +
                                    "Modelo CAD: cargado correctamente" +
                                    "</span>";

                            }

                        }
                    );


                    modelo.addEventListener(
                        'model-error',
                        function (evento) {

                            console.error(
                                'Error cargando modelo GLB:',
                                evento.detail
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='error'>" +
                                    "Modelo CAD: error al cargar" +
                                    "</span>";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // OCULTAR PISO Y CIELO EN AR
        // =====================================================

        AFRAME.registerComponent(
            'ocultar-en-ar',
            {

                init: function () {

                    const elemento =
                        this.el;


                    const escena =
                        elemento.sceneEl;


                    escena.addEventListener(
                        'enter-vr',
                        function () {

                            if (
                                escena.is('ar-mode')
                            ) {

                                elemento.setAttribute(
                                    'visible',
                                    false
                                );

                            }

                        }
                    );


                    escena.addEventListener(
                        'exit-vr',
                        function () {

                            elemento.setAttribute(
                                'visible',
                                true
                            );

                        }
                    );

                }

            }
        );



        // =====================================================
        // MOVIMIENTO COMPLETO PARA PC
        //
        // W = avanzar
        // S = retroceder
        // A = izquierda
        // D = derecha
        //
        // E = subir
        // Q = bajar
        //
        // Mouse = mirar
        // =====================================================

        AFRAME.registerComponent(
            'movimiento-pc',
            {

                schema: {

                    velocidad: {
                        type: 'number',
                        default: 2
                    },


                    velocidadVertical: {
                        type: 'number',
                        default: 1.5
                    },


                    alturaMinima: {
                        type: 'number',
                        default: 0.25
                    },


                    alturaMaxima: {
                        type: 'number',
                        default: 5
                    }

                },


                init: function () {

                    this.teclas = {};


                    this.camara =
                        document.getElementById(
                            'camaraPrincipal'
                        );


                    this.keyDown =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = true;


                            if (

                                evento.code === 'KeyW' ||
                                evento.code === 'KeyA' ||
                                evento.code === 'KeyS' ||
                                evento.code === 'KeyD' ||
                                evento.code === 'KeyQ' ||
                                evento.code === 'KeyE'

                            ) {

                                evento.preventDefault();

                            }

                        };


                    this.keyUp =
                        (evento) => {


                            this.teclas[
                                evento.code
                            ] = false;

                        };


                    window.addEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.addEventListener(
                        'keyup',
                        this.keyUp
                    );

                },


                tick: function (
                    tiempo,
                    deltaTime
                ) {


                    if (!deltaTime) {

                        return;

                    }


                    const escena =
                        this.el.sceneEl;



                    // =========================================
                    // EN AR / VR NO USAR TECLADO
                    // =========================================

                    if (

                        escena.is('vr-mode') ||
                        escena.is('ar-mode')

                    ) {

                        return;

                    }



                    if (!this.camara) {

                        return;

                    }


                    const dt =
                        deltaTime / 1000;


                    const rig =
                        this.el.object3D;



                    // =========================================
                    // ORIENTACIÓN DE LA CÁMARA
                    // =========================================

                    const quaternion =
                        new THREE.Quaternion();


                    this.camara.object3D
                        .getWorldQuaternion(
                            quaternion
                        );



                    // =========================================
                    // DIRECCIÓN HACIA ADELANTE
                    // =========================================

                    const adelante =
                        new THREE.Vector3(
                            0,
                            0,
                            -1
                        );


                    adelante.applyQuaternion(
                        quaternion
                    );


                    adelante.y = 0;


                    if (
                        adelante.lengthSq() > 0
                    ) {

                        adelante.normalize();

                    }



                    // =========================================
                    // DIRECCIÓN HACIA LA DERECHA
                    // =========================================

                    const derecha =
                        new THREE.Vector3(
                            1,
                            0,
                            0
                        );


                    derecha.applyQuaternion(
                        quaternion
                    );


                    derecha.y = 0;


                    if (
                        derecha.lengthSq() > 0
                    ) {

                        derecha.normalize();

                    }



                    // =========================================
                    // W
                    // =========================================

                    if (
                        this.teclas['KeyW']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // S
                    // =========================================

                    if (
                        this.teclas['KeyS']
                    ) {

                        rig.position.addScaledVector(

                            adelante,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // D
                    // =========================================

                    if (
                        this.teclas['KeyD']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // A
                    // =========================================

                    if (
                        this.teclas['KeyA']
                    ) {

                        rig.position.addScaledVector(

                            derecha,

                            -this.data.velocidad *
                            dt

                        );

                    }



                    // =========================================
                    // E = SUBIR
                    // =========================================

                    if (
                        this.teclas['KeyE']
                    ) {

                        rig.position.y +=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =========================================
                    // Q = BAJAR
                    // =========================================

                    if (
                        this.teclas['KeyQ']
                    ) {

                        rig.position.y -=

                            this.data
                                .velocidadVertical *
                            dt;

                    }



                    // =========================================
                    // LÍMITES DE ALTURA
                    // =========================================

                    rig.position.y =
                        THREE.MathUtils.clamp(

                            rig.position.y,

                            this.data
                                .alturaMinima,

                            this.data
                                .alturaMaxima

                        );

                },


                remove: function () {


                    window.removeEventListener(
                        'keydown',
                        this.keyDown
                    );


                    window.removeEventListener(
                        'keyup',
                        this.keyUp
                    );

                }

            }
        );



        // =====================================================
        // AR CON HIT TEST
        //
        // El modelo se coloca UNA SOLA VEZ.
        //
        // Después deja de actualizarse.
        // =====================================================

        AFRAME.registerComponent(
            'ar-fijo-estable',
            {

                init: function () {


                    this.escena =
                        this.el;


                    this.modelo =
                        document.getElementById(
                            'objetoXR'
                        );


                    this.reticulo =
                        document.getElementById(
                            'reticuloAR'
                        );


                    this.rig =
                        document.getElementById(
                            'rig'
                        );


                    this.panel =
                        document.getElementById(
                            'overlay'
                        );


                    this.texto =
                        document.getElementById(
                            'instruccionAR'
                        );


                    this.session =
                        null;


                    this.viewerSpace =
                        null;


                    this.referenceSpace =
                        null;


                    this.hitTestSource =
                        null;


                    this.ultimaPosicion =
                        null;


                    this.colocado =
                        false;


                    this.posicionPC =
                        new THREE.Vector3();



                    // =================================================
                    // TOCAR PARA COLOCAR
                    // =================================================

                    this.seleccionar =
                        () => {


                            if (
                                !this.escena.is('ar-mode')
                            ) {

                                return;

                            }


                            if (
                                this.colocado
                            ) {

                                return;

                            }


                            if (
                                !this.ultimaPosicion
                            ) {

                                return;

                            }



                            // =========================================
                            // COPIAR LA POSICIÓN DETECTADA
                            // =========================================

                            this.modelo.object3D.position.set(

                                this.ultimaPosicion.x,

                                this.ultimaPosicion.y,

                                this.ultimaPosicion.z

                            );



                            // Mostrar modelo.

                            this.modelo.setAttribute(
                                'visible',
                                true
                            );


                            // Ocultar retículo.

                            this.reticulo.setAttribute(
                                'visible',
                                false
                            );


                            // Bloquear ubicación.

                            this.colocado =
                                true;



                            this.texto.innerHTML =
                                "<span class='ok'>" +
                                "Modelo colocado y fijado." +
                                "</span>";



                            // =========================================
                            // OCULTAR PANEL
                            // =========================================

                            setTimeout(
                                () => {


                                    if (

                                        this.colocado &&
                                        this.escena.is(
                                            'ar-mode'
                                        )

                                    ) {


                                        this.panel.style.opacity =
                                            '0';


                                        setTimeout(
                                            () => {


                                                if (

                                                    this.colocado &&
                                                    this.escena.is(
                                                        'ar-mode'
                                                    )

                                                ) {

                                                    this.panel.style.display =
                                                        'none';

                                                }

                                            },

                                            300
                                        );

                                    }

                                },

                                700
                            );

                        };



                    // =================================================
                    // ENTRAR EN XR
                    // =================================================

                    this.escena.addEventListener(
                        'enter-vr',
                        async () => {


                            // =========================================
                            // GUARDAR POSICIÓN DEL PC
                            // =========================================

                            this.posicionPC.copy(
                                this.rig.object3D.position
                            );



                            // =========================================
                            // EN XR EL DISPOSITIVO MANEJA LA POSE
                            // =========================================

                            this.rig.object3D.position.set(
                                0,
                                0,
                                0
                            );



                            if (
                                !this.escena.is('ar-mode')
                            ) {

                                return;

                            }



                            this.colocado =
                                false;


                            this.ultimaPosicion =
                                null;



                            // =========================================
                            // OCULTAR MODELO HASTA SELECCIONAR
                            // =========================================

                            this.modelo.setAttribute(
                                'visible',
                                false
                            );


                            this.reticulo.setAttribute(
                                'visible',
                                false
                            );



                            // =========================================
                            // PANEL COMPACTO
                            // =========================================

                            this.panel.style.display =
                                'block';


                            this.panel.style.opacity =
                                '1';


                            this.panel.classList.add(
                                'modoAR'
                            );


                            this.texto.innerHTML =
                                "Buscando superficie..." +
                                "<br>" +
                                "Mueve lentamente el teléfono.";



                            try {


                                // =====================================
                                // SESIÓN XR
                                // =====================================

                                this.session =
                                    this.escena.renderer.xr
                                        .getSession();



                                if (
                                    !this.session
                                ) {

                                    throw new Error(
                                        'No existe sesión XR.'
                                    );

                                }



                                // =====================================
                                // ESPACIO LOCAL
                                // =====================================

                                this.referenceSpace =
                                    await this.session
                                        .requestReferenceSpace(
                                            'local'
                                        );



                                // =====================================
                                // ESPACIO DE LA CÁMARA
                                // =====================================

                                this.viewerSpace =
                                    await this.session
                                        .requestReferenceSpace(
                                            'viewer'
                                        );



                                // =====================================
                                // HIT TEST
                                // =====================================

                                this.hitTestSource =
                                    await this.session
                                        .requestHitTestSource(
                                            {

                                                space:
                                                    this.viewerSpace

                                            }
                                        );



                                // =====================================
                                // EVENTO DE TOQUE
                                // =====================================

                                this.session.addEventListener(
                                    'select',
                                    this.seleccionar
                                );


                            }

                            catch (error) {


                                console.error(
                                    'Error preparando Hit Test:',
                                    error
                                );


                                this.texto.innerHTML =
                                    "<span class='error'>" +
                                    "No se pudo iniciar Hit Test." +
                                    "</span>";

                            }

                        }
                    );



                    // =================================================
                    // SALIR DE XR
                    // =================================================

                    this.escena.addEventListener(
                        'exit-vr',
                        () => {


                            if (
                                this.session
                            ) {

                                this.session.removeEventListener(
                                    'select',
                                    this.seleccionar
                                );

                            }



                            if (
                                this.hitTestSource
                            ) {

                                try {

                                    this.hitTestSource.cancel();

                                }

                                catch (error) {

                                }

                            }



                            this.session =
                                null;


                            this.viewerSpace =
                                null;


                            this.referenceSpace =
                                null;


                            this.hitTestSource =
                                null;


                            this.ultimaPosicion =
                                null;


                            this.colocado =
                                false;



                            // =========================================
                            // RESTAURAR POSICIÓN PC
                            // =========================================

                            this.rig.object3D.position.copy(
                                this.posicionPC
                            );



                            // =========================================
                            // RESTAURAR MODELO
                            // =========================================

                            this.modelo.object3D.position.set(
                                0,
                                0,
                                -3
                            );


                            this.modelo.setAttribute(
                                'visible',
                                true
                            );



                            // =========================================
                            // RESTAURAR PANEL
                            // =========================================

                            this.reticulo.setAttribute(
                                'visible',
                                false
                            );


                            this.panel.style.display =
                                'block';


                            this.panel.style.opacity =
                                '1';


                            this.panel.classList.remove(
                                'modoAR'
                            );


                            this.texto.innerHTML =
                                "En modo AR podrás colocar " +
                                "el modelo sobre una superficie real.";

                        }
                    );

                },



                // =====================================================
                // ACTUALIZACIÓN DURANTE AR
                // =====================================================

                tick: function () {


                    if (
                        !this.escena.is('ar-mode')
                    ) {

                        return;

                    }



                    // =========================================
                    // YA COLOCADO:
                    // NO SE MUEVE MÁS
                    // =========================================

                    if (
                        this.colocado
                    ) {

                        return;

                    }



                    if (
                        !this.hitTestSource ||
                        !this.referenceSpace
                    ) {

                        return;

                    }



                    const frame =
                        this.escena.frame;


                    if (!frame) {

                        return;

                    }



                    let resultados;


                    try {

                        resultados =
                            frame.getHitTestResults(
                                this.hitTestSource
                            );

                    }

                    catch (error) {

                        return;

                    }



                    if (

                        !resultados ||
                        resultados.length === 0

                    ) {


                        this.reticulo.setAttribute(
                            'visible',
                            false
                        );


                        return;

                    }



                    const resultado =
                        resultados[0];


                    const pose =
                        resultado.getPose(
                            this.referenceSpace
                        );



                    if (!pose) {

                        return;

                    }



                    // =========================================
                    // GUARDAR POSICIÓN DETECTADA
                    // =========================================

                    this.ultimaPosicion = {

                        x:
                            pose.transform.position.x,

                        y:
                            pose.transform.position.y,

                        z:
                            pose.transform.position.z

                    };



                    // =========================================
                    // MOVER RETÍCULO
                    // =========================================

                    this.reticulo.object3D.position.set(

                        this.ultimaPosicion.x,

                        this.ultimaPosicion.y,

                        this.ultimaPosicion.z

                    );


                    this.reticulo.setAttribute(
                        'visible',
                        true
                    );



                    this.texto.innerHTML =
                        "<span class='ok'>" +
                        "Superficie detectada." +
                        "</span>" +
                        "<br>" +
                        "Toca la pantalla para colocar el modelo.";

                }

            }
        );



        // =====================================================
        // DETECCIÓN DE COMPATIBILIDAD WEBXR
        // =====================================================

        async function comprobarXR() {


            const webxr =
                document.getElementById(
                    'estadoWebXR'
                );


            const vr =
                document.getElementById(
                    'estadoVR'
                );


            const ar =
                document.getElementById(
                    'estadoAR'
                );



            if (!navigator.xr) {


                webxr.innerHTML =
                    'WebXR: no disponible';

                webxr.className =
                    'error';


                vr.innerHTML =
                    'VR: no disponible';

                vr.className =
                    'error';


                ar.innerHTML =
                    'AR: no disponible';

                ar.className =
                    'error';


                return;

            }



            webxr.innerHTML =
                'WebXR: disponible';

            webxr.className =
                'ok';



            // =================================================
            // VR
            // =================================================

            try {


                const soportaVR =
                    await navigator.xr
                        .isSessionSupported(
                            'immersive-vr'
                        );


                vr.innerHTML =
                    soportaVR
                    ?
                    'VR: compatible'
                    :
                    'VR: no compatible';


                vr.className =
                    soportaVR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                vr.innerHTML =
                    'VR: error';

                vr.className =
                    'error';

            }



            // =================================================
            // AR
            // =================================================

            try {


                const soportaAR =
                    await navigator.xr
                        .isSessionSupported(
                            'immersive-ar'
                        );


                ar.innerHTML =
                    soportaAR
                    ?
                    'AR: compatible'
                    :
                    'AR: no compatible';


                ar.className =
                    soportaAR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                ar.innerHTML =
                    'AR: error';

                ar.className =
                    'error';

            }

        }



        window.addEventListener(
            'load',
            comprobarXR
        );


    </script>

</head>



<body>



<!-- =========================================================
     PANEL DE INFORMACIÓN
========================================================= -->

<div id="overlay">


    <div id="titulo">

        MODELO CAD INDUSTRIAL XR

    </div>



    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>



    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>



    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>



    <div
        id="estadoModelo"
        class="esperando">

        Modelo CAD: cargando...

    </div>



    <!-- =====================================================
         CONTROLES PC
    ====================================================== -->

    <div id="controlesPC">

        <b>Controles PC</b>

        <br>

        W / S = adelante / atrás

        <br>

        A / D = izquierda / derecha

        <br>

        E = subir

        <br>

        Q = bajar / agacharse

        <br>

        Mouse = mirar

    </div>



    <div id="instruccionAR">

        En modo AR podrás colocar
        el modelo sobre una superficie real.

    </div>


</div>



<!-- =========================================================
     ESCENA PRINCIPAL
========================================================= -->

<a-scene


    xr-mode-ui="
        XRMode: xr
    "


    webxr="
        optionalFeatures: hit-test, dom-overlay;
        referenceSpaceType: local;
        overlayElement: #overlay;
    "


    ar-fijo-estable


    renderer="
        colorManagement: true;
        antialias: true;
        alpha: true;
    "


    background="
        color: #DCE6EA;
        transparent: true;
    "
>



    <!-- =====================================================
         MODELO GLB
    ====================================================== -->

    <a-assets timeout="30000">


        <a-asset-item

            id="modeloIndustrial"

            src="./models/modelo_industrial.glb">

        </a-asset-item>


    </a-assets>



    <!-- =====================================================
         ILUMINACIÓN
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="1">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="1"

        position="-3 5 3">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="0.5"

        position="4 3 -4">

    </a-light>



    <!-- =====================================================
         RETÍCULO DE AR
    ====================================================== -->

    <a-ring

        id="reticuloAR"

        visible="false"

        position="0 0 -2"

        rotation="-90 0 0"

        radius-inner="0.06"

        radius-outer="0.10"

        color="#00FF88"

        material="
            transparent: true;
            opacity: 0.85;
            side: double;
        ">

    </a-ring>



    <!-- =====================================================
         CONTENEDOR DEL MODELO CAD
    ====================================================== -->

    <a-entity

        id="objetoXR"

        position="0 0 -3"

        visible="true"
    >



        <!-- =================================================
             BRAZO ROBÓTICO

             CAMBIO PRINCIPAL:

             ANTES:
             scale="0.01 0.01 0.01"

             AHORA:
             scale="0.003 0.003 0.003"

             El modelo visualmente queda al 30 %
             del tamaño anterior.
        ================================================== -->

        <a-entity

            id="robotCAD"

            gltf-model="#modeloIndustrial"

            control-modelo

            position="0 0 0"

            rotation="0 90 0"

            scale="0.003 0.003 0.003"

            shadow="
                cast: true;
                receive: true;
            ">

        </a-entity>


    </a-entity>



    <!-- =====================================================
         PISO PC / VR
    ====================================================== -->

    <a-plane

        ocultar-en-ar

        position="0 0 -3"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#78909C"

        shadow="
            receive: true;
        ">

    </a-plane>



    <!-- =====================================================
         CIELO PC / VR
    ====================================================== -->

    <a-sky

        ocultar-en-ar

        color="#DCE6EA">

    </a-sky>



    <!-- =====================================================
         RIG DEL USUARIO
    ====================================================== -->

    <a-entity

        id="rig"

        position="0 1.6 0"

        movimiento-pc="
            velocidad: 2;
            velocidadVertical: 1.5;
            alturaMinima: 0.25;
            alturaMaxima: 5;
        "
    >



        <!-- =================================================
             CÁMARA
        ================================================== -->

        <a-camera

            id="camaraPrincipal"

            position="0 0 0"

            look-controls>

        </a-camera>


    </a-entity>



</a-scene>



</body>

</html>
