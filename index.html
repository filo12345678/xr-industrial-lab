<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >

    <title>Laboratorio XR - A-Frame</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script
        src="https://aframe.io/releases/1.8.0/aframe.min.js">
    </script>


    <!-- =====================================================
         ESTILO DEL PANEL
    ====================================================== -->

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        #overlay {

            position: fixed;

            top: 15px;
            left: 15px;

            width: 285px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.72);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;
        }


        #titulo {

            color: #00ff88;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .ok {
            color: #00ff88;
        }


        .error {
            color: #ff5555;
        }


        .esperando {
            color: #ffcc00;
        }


        #instruccionAR {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;

            color: #ffffff;
        }

    </style>


    <script>

        // =====================================================
        // OCULTAR OBJETOS AL ENTRAR EN AR
        //
        // En escritorio los objetos se ven normalmente.
        // En AR se ocultan hasta que el usuario encuentre
        // una superficie y toque la pantalla.
        // =====================================================

        AFRAME.registerComponent(
            'preparar-ar',
            {

                init: function () {

                    const objeto =
                        this.el;

                    const escena =
                        objeto.sceneEl;


                    escena.addEventListener(
                        'enter-vr',
                        function () {

                            if (
                                escena.is('ar-mode')
                            ) {

                                objeto.setAttribute(
                                    'visible',
                                    false
                                );


                                const texto =
                                    document.getElementById(
                                        'instruccionAR'
                                    );


                                if (texto) {

                                    texto.innerHTML =
                                        "Mueve lentamente el teléfono " +
                                        "para detectar una superficie.<br>" +
                                        "Cuando aparezca el retículo, " +
                                        "<b>toca la pantalla</b>.";

                                }

                            }

                        }
                    );


                    escena.addEventListener(
                        'exit-vr',
                        function () {

                            objeto.setAttribute(
                                'visible',
                                true
                            );

                        }
                    );

                }

            }
        );


        // =====================================================
        // MENSAJES DEL HIT TEST
        // =====================================================

        AFRAME.registerComponent(
            'estado-hit-test',
            {

                init: function () {

                    const escena =
                        this.el;


                    escena.addEventListener(
                        'ar-hit-test-start',
                        function () {

                            console.log(
                                "Hit Test iniciado"
                            );

                        }
                    );


                    escena.addEventListener(
                        'ar-hit-test-achieved',
                        function () {

                            console.log(
                                "Superficie detectada"
                            );


                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Superficie detectada." +
                                    "</span><br>" +
                                    "Toca la pantalla para " +
                                    "colocar el objeto.";

                            }

                        }
                    );


                    escena.addEventListener(
                        'ar-hit-test-select',
                        function () {

                            console.log(
                                "Objeto colocado"
                            );


                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Objeto colocado correctamente." +
                                    "</span><br>" +
                                    "Puedes apuntar a otra superficie " +
                                    "y tocar nuevamente para moverlo.";

                            }

                        }
                    );

                }

            }
        );


        // =====================================================
        // DETECCIÓN DE COMPATIBILIDAD WEBXR
        // =====================================================

        async function detectarCompatibilidadXR() {

            const estadoWebXR =
                document.getElementById(
                    "estadoWebXR"
                );

            const estadoVR =
                document.getElementById(
                    "estadoVR"
                );

            const estadoAR =
                document.getElementById(
                    "estadoAR"
                );


            if (!navigator.xr) {

                estadoWebXR.innerHTML =
                    "WebXR: no disponible";

                estadoWebXR.className =
                    "error";


                estadoVR.innerHTML =
                    "VR: no disponible";

                estadoVR.className =
                    "error";


                estadoAR.innerHTML =
                    "AR: no disponible";

                estadoAR.className =
                    "error";


                return;

            }


            estadoWebXR.innerHTML =
                "WebXR: disponible";

            estadoWebXR.className =
                "ok";


            // -------------------------------------------------
            // VR
            // -------------------------------------------------

            try {

                const soportaVR =
                    await navigator.xr
                        .isSessionSupported(
                            "immersive-vr"
                        );


                estadoVR.innerHTML =
                    soportaVR
                    ?
                    "VR: compatible"
                    :
                    "VR: no compatible";


                estadoVR.className =
                    soportaVR
                    ?
                    "ok"
                    :
                    "error";

            }

            catch (error) {

                estadoVR.innerHTML =
                    "VR: error";

                estadoVR.className =
                    "error";

            }


            // -------------------------------------------------
            // AR
            // -------------------------------------------------

            try {

                const soportaAR =
                    await navigator.xr
                        .isSessionSupported(
                            "immersive-ar"
                        );


                estadoAR.innerHTML =
                    soportaAR
                    ?
                    "AR: compatible"
                    :
                    "AR: no compatible";


                estadoAR.className =
                    soportaAR
                    ?
                    "ok"
                    :
                    "error";

            }

            catch (error) {

                estadoAR.innerHTML =
                    "AR: error";

                estadoAR.className =
                    "error";

            }

        }


        window.addEventListener(
            "load",
            detectarCompatibilidadXR
        );

    </script>

</head>


<body>


<!-- =========================================================
     PANEL DE INFORMACIÓN
========================================================= -->

<div id="overlay">

    <div id="titulo">
        LABORATORIO XR
    </div>


    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>


    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>


    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>


    <div id="instruccionAR">

        En modo AR podrás colocar los objetos
        sobre una superficie real.

    </div>

</div>



<!-- =========================================================
     ESCENA
========================================================= -->

<a-scene

    xr-mode-ui="
        XRMode: xr
    "

    webxr="
        referenceSpaceType: local;
        optionalFeatures: hit-test,dom-overlay;
        overlayElement: #overlay;
    "

    ar-hit-test="
        target: #objetoXR;
        type: footprint;
    "

    estado-hit-test

    renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
        alpha: true;
    "

    background="
        color: #ECECEC;
        transparent: true;
    "
>


    <!-- =====================================================
         LUCES
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="0.9">

    </a-light>


    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="0.8"

        position="-2 4 2">

    </a-light>



    <!-- =====================================================
         GRUPO DE OBJETOS
         
         ESTE ES EL ELEMENTO QUE SE COLOCARÁ SOBRE
         LA SUPERFICIE DETECTADA.
    ====================================================== -->

    <a-entity

        id="objetoXR"

        preparar-ar

        position="0 0 -3"

        scale="0.5 0.5 0.5"
    >


      
<!-- BASE -->
<a-box
    position="0 0.10 0"
    width="5"
    height="0.20"
    depth="2.5"
    color="#555555"
    shadow>
</a-box>


<!-- CUBO -->
<a-box
    position="-1.5 0.7 0"
    rotation="0 45 0"
    width="1"
    height="1"
    depth="1"
    color="#4CC3D9"
    shadow>
</a-box>


<!-- ESFERA -->
<a-sphere
    position="0 0.9 0"
    radius="0.65"
    color="#EF2D5E"
    shadow>
</a-sphere>


<!-- CILINDRO -->
<a-cylinder
    position="1.6 0.75 0"
    radius="0.45"
    height="1.3"
    color="#FFC65D"
    shadow>
</a-cylinder>



    <!-- =====================================================
         PISO PARA MODO NORMAL / VR

         Se mantiene como referencia visual cuando no estamos
         usando AR.
    ====================================================== -->

    <a-plane

        position="0 0 -4"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#7BC8A4"

        shadow="receive: true">

    </a-plane>



    <!-- =====================================================
         CIELO
    ====================================================== -->

    <a-sky

        color="#ECECEC">

    </a-sky>



    <!-- =====================================================
         CÁMARA
    ====================================================== -->

    <a-entity
        position="0 1.6 0">

        <a-camera

            look-controls

            wasd-controls>

        </a-camera>

    </a-entity>


</a-scene>


</body>

</html>
