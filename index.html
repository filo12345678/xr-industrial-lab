<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Laboratorio XR - Modelo CAD Industrial</title>

    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        #overlay {

            position: fixed;

            top: 15px;
            left: 15px;

            width: 300px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;

            pointer-events: none;
        }


        #titulo {

            color: #00ff88;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .ok {
            color: #00ff88;
        }


        .error {
            color: #ff5555;
        }


        .esperando {
            color: #ffcc00;
        }


        #estadoModelo {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }


        #instruccionAR {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }

    </style>



    <script>


        // =====================================================
        // CONTROL DE CARGA DEL MODELO GLB
        // =====================================================

        AFRAME.registerComponent(
            'control-modelo',
            {

                init: function () {

                    const modelo = this.el;


                    modelo.addEventListener(
                        'model-loaded',
                        function () {

                            console.log(
                                "Modelo GLB cargado correctamente"
                            );


                            const estado =
                                document.getElementById(
                                    "estadoModelo"
                                );


                            estado.innerHTML =
                                "<span class='ok'>" +
                                "Modelo CAD: cargado correctamente" +
                                "</span>";

                        }
                    );


                    modelo.addEventListener(
                        'model-error',
                        function (evento) {

                            console.error(
                                "Error cargando GLB:",
                                evento.detail
                            );


                            const estado =
                                document.getElementById(
                                    "estadoModelo"
                                );


                            estado.innerHTML =
                                "<span class='error'>" +
                                "Modelo CAD: error al cargar" +
                                "</span>";

                        }
                    );

                }

            }
        );



        // =====================================================
        // COLOCACIÓN FIJA DEL MODELO EN REALIDAD AUMENTADA
        //
        // IMPORTANTE:
        //
        // El Hit Test NO mueve directamente el robot.
        //
        // Mueve un punto auxiliar invisible.
        //
        // Cuando el usuario toca la pantalla:
        //
        // 1. Se obtiene la posición del punto.
        // 2. Se copia al robot.
        // 3. El robot queda BLOQUEADO.
        //
        // Por lo tanto puede caminar alrededor de él.
        // =====================================================

        AFRAME.registerComponent(
            'colocacion-fija-ar',
            {

                init: function () {

                    const escena = this.el;

                    this.modelo =
                        document.getElementById(
                            "objetoXR"
                        );

                    this.punto =
                        document.getElementById(
                            "puntoColocacionAR"
                        );


                    // Indica si ya colocamos el modelo.
                    this.colocado = false;



                    // =================================================
                    // ENTRAR A AR
                    // =================================================

                    escena.addEventListener(
                        "enter-vr",
                        () => {

                            if (!escena.is("ar-mode")) {
                                return;
                            }


                            this.colocado = false;


                            // Ocultamos el modelo hasta que el
                            // usuario seleccione una superficie.

                            this.modelo.setAttribute(
                                "visible",
                                false
                            );


                            const texto =
                                document.getElementById(
                                    "instruccionAR"
                                );


                            texto.innerHTML =
                                "Mueve lentamente el teléfono.<br>" +
                                "Busca una mesa o el piso.";

                        }
                    );



                    // =================================================
                    // HIT TEST INICIADO
                    // =================================================

                    escena.addEventListener(
                        "ar-hit-test-start",
                        () => {

                            if (!escena.is("ar-mode")) {
                                return;
                            }


                            if (this.colocado) {
                                return;
                            }


                            const texto =
                                document.getElementById(
                                    "instruccionAR"
                                );


                            texto.innerHTML =
                                "Buscando una superficie..." +
                                "<br>" +
                                "Mueve lentamente el dispositivo.";

                        }
                    );



                    // =================================================
                    // SUPERFICIE ENCONTRADA
                    // =================================================

                    escena.addEventListener(
                        "ar-hit-test-achieved",
                        () => {

                            if (!escena.is("ar-mode")) {
                                return;
                            }


                            if (this.colocado) {
                                return;
                            }


                            const texto =
                                document.getElementById(
                                    "instruccionAR"
                                );


                            texto.innerHTML =
                                "<span class='ok'>" +
                                "Superficie detectada." +
                                "</span>" +
                                "<br>" +
                                "Toca una vez para colocar el robot.";

                        }
                    );



                    // =================================================
                    // USUARIO TOCA LA SUPERFICIE
                    // =================================================

                    escena.addEventListener(
                        "ar-hit-test-select",
                        () => {


                            // Si no estamos en AR, ignorar.

                            if (!escena.is("ar-mode")) {
                                return;
                            }


                            // Si ya fue colocado, NO moverlo nuevamente.

                            if (this.colocado) {
                                return;
                            }


                            // Esperamos un frame para asegurarnos
                            // de que A-Frame haya actualizado primero
                            // el punto del Hit Test.

                            requestAnimationFrame(
                                () => {


                                    // =================================
                                    // POSICIÓN Y ORIENTACIÓN DEL HIT TEST
                                    // =================================

                                    const posicion =
                                        new THREE.Vector3();


                                    const orientacion =
                                        new THREE.Quaternion();


                                    this.punto.object3D
                                        .getWorldPosition(
                                            posicion
                                        );


                                    this.punto.object3D
                                        .getWorldQuaternion(
                                            orientacion
                                        );



                                    // =================================
                                    // COPIAR AL MODELO
                                    // =================================

                                    this.modelo.object3D
                                        .position
                                        .copy(
                                            posicion
                                        );


                                    this.modelo.object3D
                                        .quaternion
                                        .copy(
                                            orientacion
                                        );


                                    // Mostrar modelo.

                                    this.modelo.setAttribute(
                                        "visible",
                                        true
                                    );


                                    // BLOQUEAR POSICIÓN.

                                    this.colocado = true;



                                    // =================================
                                    // MENSAJE
                                    // =================================

                                    const texto =
                                        document.getElementById(
                                            "instruccionAR"
                                        );


                                    texto.innerHTML =
                                        "<span class='ok'>" +
                                        "Robot colocado y fijado." +
                                        "</span>" +
                                        "<br>" +
                                        "Ahora camina alrededor del " +
                                        "modelo para observar todas " +
                                        "sus caras.";

                                }
                            );

                        }
                    );



                    // =================================================
                    // SALIR DE AR
                    // =================================================

                    escena.addEventListener(
                        "exit-vr",
                        () => {


                            this.colocado = false;


                            // Restauramos posición para la vista
                            // normal / IMU.

                            this.modelo.setAttribute(
                                "position",
                                "0 0 -3"
                            );


                            this.modelo.setAttribute(
                                "rotation",
                                "0 0 0"
                            );


                            this.modelo.setAttribute(
                                "visible",
                                true
                            );


                            const texto =
                                document.getElementById(
                                    "instruccionAR"
                                );


                            texto.innerHTML =
                                "En AR podrás colocar el modelo " +
                                "sobre una superficie real.";

                        }
                    );

                }

            }
        );



        // =====================================================
        // COMPROBAR COMPATIBILIDAD WEBXR
        // =====================================================

        async function comprobarXR() {


            const webxr =
                document.getElementById(
                    "estadoWebXR"
                );


            const vr =
                document.getElementById(
                    "estadoVR"
                );


            const ar =
                document.getElementById(
                    "estadoAR"
                );



            if (!navigator.xr) {


                webxr.innerHTML =
                    "WebXR: no disponible";

                webxr.className =
                    "error";


                vr.innerHTML =
                    "VR: no disponible";

                vr.className =
                    "error";


                ar.innerHTML =
                    "AR: no disponible";

                ar.className =
                    "error";


                return;

            }



            webxr.innerHTML =
                "WebXR: disponible";

            webxr.className =
                "ok";



            // =================================================
            // VR
            // =================================================

            try {


                const soportaVR =
                    await navigator.xr
                        .isSessionSupported(
                            "immersive-vr"
                        );


                vr.innerHTML =
                    soportaVR
                    ?
                    "VR: compatible"
                    :
                    "VR: no compatible";


                vr.className =
                    soportaVR
                    ?
                    "ok"
                    :
                    "error";


            }

            catch (error) {


                vr.innerHTML =
                    "VR: error";

                vr.className =
                    "error";

            }



            // =================================================
            // AR
            // =================================================

            try {


                const soportaAR =
                    await navigator.xr
                        .isSessionSupported(
                            "immersive-ar"
                        );


                ar.innerHTML =
                    soportaAR
                    ?
                    "AR: compatible"
                    :
                    "AR: no compatible";


                ar.className =
                    soportaAR
                    ?
                    "ok"
                    :
                    "error";


            }

            catch (error) {


                ar.innerHTML =
                    "AR: error";

                ar.className =
                    "error";

            }

        }



        window.addEventListener(
            "load",
            comprobarXR
        );


    </script>

</head>



<body>



<!-- =========================================================
     PANEL
========================================================= -->

<div id="overlay">


    <div id="titulo">

        MODELO CAD INDUSTRIAL XR

    </div>


    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>


    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>


    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>


    <div
        id="estadoModelo"
        class="esperando">

        Modelo CAD: cargando...

    </div>


    <div id="instruccionAR">

        En AR podrás colocar el modelo
        sobre una superficie real.

    </div>


</div>



<!-- =========================================================
     ESCENA
========================================================= -->

<a-scene


    xr-mode-ui="
        XRMode: xr
    "


    webxr="
        optionalFeatures: hit-test, dom-overlay;
        referenceSpaceType: local;
        overlayElement: #overlay;
    "


    ar-hit-test="
        target: #puntoColocacionAR;
        type: footprint;
    "


    colocacion-fija-ar


    renderer="
        colorManagement: true;
        antialias: true;
        alpha: true;
    "


    background="
        color: #DCE6EA;
        transparent: true;
    "
>



    <!-- =====================================================
         ARCHIVO GLB
    ====================================================== -->

    <a-assets timeout="30000">


        <a-asset-item

            id="modeloIndustrial"

            src="./models/modelo_industrial.glb">

        </a-asset-item>


    </a-assets>



    <!-- =====================================================
         ILUMINACIÓN
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="1">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="1"

        position="-3 5 3">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="0.5"

        position="4 3 -4">

    </a-light>



    <!-- =====================================================
         PUNTO AUXILIAR PARA HIT TEST

         ESTE ES EL OBJETO QUE A-FRAME MUEVE.

         EL ROBOT YA NO ES EL TARGET DEL HIT TEST.

         ES INVISIBLE.
    ====================================================== -->

    <a-cylinder

        id="puntoColocacionAR"

        position="0 -100 0"

        radius="0.20"

        height="0.01"

        material="
            color: #00FF88;
            transparent: true;
            opacity: 0;
            depthWrite: false;
        ">

    </a-cylinder>



    <!-- =====================================================
         CONTENEDOR DEL ROBOT

         ESTE OBJETO QUEDA FIJO DESPUÉS DE COLOCARLO.
    ====================================================== -->

    <a-entity

        id="objetoXR"

        position="0 0 -3"

        rotation="0 0 0"

        visible="true"
    >



        <!-- =================================================
             MODELO CAD

             IMPORTANTE:

             rotation="0 90 0"

             gira el modelo 90 grados para que en la vista
             normal / IMU aparezca DE LADO.
        ================================================== -->

        <a-entity

            id="robotCAD"

            gltf-model="#modeloIndustrial"

            control-modelo

            position="0 0 0"

            rotation="0 90 0"

            scale="0.01 0.01 0.01"

            shadow="
                cast: true;
                receive: true;
            ">

        </a-entity>


    </a-entity>



    <!-- =====================================================
         PISO PARA VISTA NORMAL
    ====================================================== -->

    <a-plane

        hide-on-enter-ar

        position="0 0 -3"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#78909C"

        shadow="
            receive: true;
        ">

    </a-plane>



    <!-- =====================================================
         CIELO
    ====================================================== -->

    <a-sky

        hide-on-enter-ar

        color="#DCE6EA">

    </a-sky>



    <!-- =====================================================
         CÁMARA

         EN EL TELÉFONO LA IMU CONTROLA SU ORIENTACIÓN.
    ====================================================== -->

    <a-entity

        id="rig"

        position="0 1.6 0"
    >


        <a-camera

            position="0 0 0"

            look-controls

            wasd-controls>

        </a-camera>


    </a-entity>



</a-scene>


</body>

</html>
