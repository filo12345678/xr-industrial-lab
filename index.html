<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Modelo CAD Industrial XR</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #dfe7eb;
        }

        #info {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.70);
            color: white;
            padding: 12px 14px;
            border-radius: 10px;
            max-width: 270px;
            font-size: 13px;
            line-height: 1.45;
        }

        #info h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #00ff99;
        }

        #estadoModelo {
            margin-top: 8px;
            font-weight: bold;
        }

        .ok {
            color: #00ff99;
        }

        .error {
            color: #ff5c5c;
        }

        .mini {
            margin-top: 8px;
            font-size: 12px;
            color: #dddddd;
        }
    </style>

    <script>
        // =========================================================
        // 1) SUBIR / BAJAR EN PC CON Q Y E
        // =========================================================
        AFRAME.registerComponent('subir-bajar', {
            schema: {
                velocidad: { type: 'number', default: 1.8 },
                minY: { type: 'number', default: 0.35 },
                maxY: { type: 'number', default: 4.0 }
            },

            init: function () {
                this.teclas = {};

                this.keyDownHandler = (e) => {
                    this.teclas[e.code] = true;
                };

                this.keyUpHandler = (e) => {
                    this.teclas[e.code] = false;
                };

                window.addEventListener('keydown', this.keyDownHandler);
                window.addEventListener('keyup', this.keyUpHandler);
            },

            tick: function (time, delta) {
                const escena = this.el.sceneEl;

                // No interferir en AR o VR
                if (escena.is('ar-mode') || escena.is('vr-mode')) {
                    return;
                }

                const dt = delta / 1000;
                const paso = this.data.velocidad * dt;
                const pos = this.el.object3D.position;

                if (this.teclas['KeyE']) {
                    pos.y += paso;
                }

                if (this.teclas['KeyQ']) {
                    pos.y -= paso;
                }

                if (pos.y < this.data.minY) pos.y = this.data.minY;
                if (pos.y > this.data.maxY) pos.y = this.data.maxY;
            },

            remove: function () {
                window.removeEventListener('keydown', this.keyDownHandler);
                window.removeEventListener('keyup', this.keyUpHandler);
            }
        });

        // =========================================================
        // 2) AJUSTAR AUTOMÁTICAMENTE EL MODELO
        //    - corrige escala
        //    - lo centra
        //    - lo apoya sobre el suelo
        // =========================================================
        AFRAME.registerComponent('ajustar-modelo', {
            schema: {
                tamanoObjetivo: { type: 'number', default: 1.35 } // tamaño final aprox. en metros/unidades escena
            },

            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const estado = document.getElementById('estadoModelo');
                    const obj = this.el.getObject3D('mesh');

                    if (!obj) {
                        if (estado) {
                            estado.textContent = 'Modelo CAD: error al cargar';
                            estado.className = 'error';
                        }
                        return;
                    }

                    // Reset inicial del mesh interno
                    obj.position.set(0, 0, 0);
                    obj.rotation.set(0, 0, 0);
                    obj.scale.set(1, 1, 1);
                    obj.updateMatrixWorld(true);

                    // Bounding box original
                    const box = new THREE.Box3().setFromObject(obj);
                    const size = new THREE.Vector3();
                    box.getSize(size);

                    const maxDim = Math.max(size.x, size.y, size.z);

                    if (maxDim <= 0) {
                        if (estado) {
                            estado.textContent = 'Modelo CAD: error en dimensiones';
                            estado.className = 'error';
                        }
                        return;
                    }

                    // Escalado uniforme automático
                    const escala = this.data.tamanoObjetivo / maxDim;
                    obj.scale.setScalar(escala);
                    obj.updateMatrixWorld(true);

                    // Recalcular caja después del escalado
                    const box2 = new THREE.Box3().setFromObject(obj);
                    const center = new THREE.Vector3();
                    box2.getCenter(center);

                    // Centrar en X y Z, apoyar en Y = 0
                    obj.position.x -= center.x;
                    obj.position.z -= center.z;
                    obj.position.y -= box2.min.y;

                    obj.updateMatrixWorld(true);

                    if (estado) {
                        estado.textContent = 'Modelo CAD: cargado correctamente';
                        estado.className = 'ok';
                    }
                });

                this.el.addEventListener('model-error', () => {
                    const estado = document.getElementById('estadoModelo');
                    if (estado) {
                        estado.textContent = 'Modelo CAD: error al cargar';
                        estado.className = 'error';
                    }
                });
            }
        });

        // =========================================================
        // 3) GESTIÓN GENERAL DE XR
        //    - oculta piso y cielo en AR
        //    - oculta panel en AR
        //    - muestra modelo preview fuera de AR
        // =========================================================
        AFRAME.registerComponent('gestor-xr', {
            init: function () {
                const escena = this.el;
                const suelo = document.getElementById('suelo');
                const cielo = document.getElementById('cielo');
                const info = document.getElementById('info');
                const modeloXR = document.getElementById('modeloXR');
                const reticulo = document.getElementById('reticulo');

                escena.addEventListener('enter-vr', () => {
                    // Si entra en AR
                    if (escena.is('ar-mode')) {
                        if (suelo) suelo.setAttribute('visible', 'false');
                        if (cielo) cielo.setAttribute('visible', 'false');
                        if (info) info.style.display = 'none';

                        // Ocultar preview y esperar colocación
                        if (modeloXR) modeloXR.setAttribute('visible', 'false');
                        if (reticulo) reticulo.setAttribute('visible', 'false');
                    }
                });

                escena.addEventListener('exit-vr', () => {
                    if (suelo) suelo.setAttribute('visible', 'true');
                    if (cielo) cielo.setAttribute('visible', 'true');
                    if (info) info.style.display = 'block';

                    // Restaurar preview en escritorio / modo normal
                    if (modeloXR) {
                        modeloXR.setAttribute('visible', 'true');
                        modeloXR.setAttribute('position', '0 0 -3.2');
                    }

                    if (reticulo) reticulo.setAttribute('visible', 'false');
                });
            }
        });

        // =========================================================
        // 4) COLOCACIÓN SIMPLE EN AR
        //    - retículo sobre la superficie
        //    - al tocar, coloca el modelo allí
        //    - el modelo NO queda pegado a la cámara
        // =========================================================
        AFRAME.registerComponent('colocacion-ar', {
            init: function () {
                const escena = this.el;
                const modeloXR = document.getElementById('modeloXR');
                const reticulo = document.getElementById('reticulo');

                escena.addEventListener('ar-hit-test-achieved', () => {
                    if (escena.is('ar-mode') && reticulo) {
                        reticulo.setAttribute('visible', 'true');
                    }
                });

                escena.addEventListener('ar-hit-test-lost', () => {
                    if (reticulo) {
                        reticulo.setAttribute('visible', 'false');
                    }
                });

                escena.addEventListener('ar-hit-test-select', () => {
                    if (!escena.is('ar-mode')) return;
                    if (!reticulo || !modeloXR) return;

                    // Copiar posición del retículo al modelo
                    modeloXR.object3D.position.copy(reticulo.object3D.position);
                    modeloXR.object3D.visible = true;
                });
            }
        });

        // =========================================================
        // 5) INFORMACIÓN DE COMPATIBILIDAD XR
        // =========================================================
        async function revisarXR() {
            const estadoXR = document.getElementById('estadoXR');
            const estadoVR = document.getElementById('estadoVR');
            const estadoAR = document.getElementById('estadoAR');

            if (!navigator.xr) {
                estadoXR.textContent = 'WebXR: no disponible';
                estadoVR.textContent = 'VR: no compatible';
                estadoAR.textContent = 'AR: no compatible';

                estadoXR.className = 'error';
                estadoVR.className = 'error';
                estadoAR.className = 'error';
                return;
            }

            estadoXR.textContent = 'WebXR: disponible';
            estadoXR.className = 'ok';

            try {
                const vr = await navigator.xr.isSessionSupported('immersive-vr');
                estadoVR.textContent = vr ? 'VR: compatible' : 'VR: no compatible';
                estadoVR.className = vr ? 'ok' : 'error';
            } catch {
                estadoVR.textContent = 'VR: no compatible';
                estadoVR.className = 'error';
            }

            try {
                const ar = await navigator.xr.isSessionSupported('immersive-ar');
                estadoAR.textContent = ar ? 'AR: compatible' : 'AR: no compatible';
                estadoAR.className = ar ? 'ok' : 'error';
            } catch {
                estadoAR.textContent = 'AR: no compatible';
                estadoAR.className = 'error';
            }
        }

        window.addEventListener('load', revisarXR);
    </script>
</head>

<body>

    <div id="info">
        <h3>MODELO CAD INDUSTRIAL XR</h3>

        <div id="estadoXR">WebXR: comprobando...</div>
        <div id="estadoVR">VR: comprobando...</div>
        <div id="estadoAR">AR: comprobando...</div>
        <div id="estadoModelo">Modelo CAD: cargando...</div>

        <div class="mini">
            <b>PC:</b> W A S D para moverse, Q/E para bajar-subir, mouse para mirar.<br>
            <b>Celular:</b> puedes usar IMU.<br>
            <b>AR:</b> entra en AR, busca una superficie y toca para colocar el modelo.
        </div>
    </div>

    <a-scene
        gestor-xr
        colocacion-ar
        xr-mode-ui="enabled: true"
        webxr="optionalFeatures: hit-test, local-floor"
        ar-hit-test="target: #reticulo; type: map; mapSize: 0.18 0.18"
        renderer="antialias: true; colorManagement: true; alpha: true"
        background="color: #dfe7eb"
    >

        <!-- Activos -->
        <a-assets timeout="30000">
            <!-- CAMBIA ESTA RUTA SOLO SI TU ARCHIVO TIENE OTRO NOMBRE -->
            <a-asset-item id="modeloIndustrial" src="./models/modelo_industrial.glb"></a-asset-item>
        </a-assets>

        <!-- Luces -->
        <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.75" position="1 3 2"></a-light>

        <!-- Modelo principal -->
        <a-entity id="modeloXR" position="0 0 -3.2" visible="true">
            <a-entity
                id="robotCAD"
                gltf-model="#modeloIndustrial"
                ajustar-modelo="tamanoObjetivo: 1.35"
                rotation="0 -90 0"
                position="0 0 0"
            ></a-entity>
        </a-entity>

        <!-- Retículo AR -->
        <a-entity id="reticulo" visible="false">
            <a-ring
                rotation="-90 0 0"
                radius-inner="0.05"
                radius-outer="0.07"
                color="#00ff99"
                material="shader: flat; opacity: 0.9"
            ></a-ring>
        </a-entity>

        <!-- Piso normal para PC / vista previa -->
        <a-plane
            id="suelo"
            position="0 0 -3"
            rotation="-90 0 0"
            width="12"
            height="12"
            color="#7f919d"
        ></a-plane>

        <!-- Cielo -->
        <a-sky id="cielo" color="#dfe7eb"></a-sky>

        <!-- Cámara / usuario -->
        <a-entity
            id="camaraRig"
            camera
            position="0 1.6 0"
            look-controls="enabled: true; magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true"
            wasd-controls="acceleration: 25"
            subir-bajar="velocidad: 1.8; minY: 0.35; maxY: 4.0"
        ></a-entity>

    </a-scene>

</body>
</html>
