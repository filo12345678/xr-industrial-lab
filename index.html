<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Laboratorio XR - Modelo CAD Industrial</title>

    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        #overlay {

            position: fixed;

            top: 15px;

            left: 15px;

            width: 310px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;

            pointer-events: none;
        }


        #titulo {

            color: #00ff88;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .ok {

            color: #00ff88;
        }


        .error {

            color: #ff5555;
        }


        .esperando {

            color: #ffcc00;
        }


        #estadoModelo {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }


        #controlesPC {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }


        #instruccionAR {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;
        }

    </style>



    <script>


        // =====================================================
        // CARGA DEL MODELO GLB
        // =====================================================

        AFRAME.registerComponent(
            'control-modelo',
            {

                init: function () {

                    const modelo = this.el;


                    modelo.addEventListener(
                        'model-loaded',
                        function () {

                            console.log(
                                'Modelo GLB cargado correctamente'
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='ok'>" +
                                    "Modelo CAD: cargado correctamente" +
                                    "</span>";

                            }

                        }
                    );


                    modelo.addEventListener(
                        'model-error',
                        function (evento) {

                            console.error(
                                'Error cargando modelo:',
                                evento.detail
                            );


                            const estado =
                                document.getElementById(
                                    'estadoModelo'
                                );


                            if (estado) {

                                estado.innerHTML =
                                    "<span class='error'>" +
                                    "Modelo CAD: error al cargar" +
                                    "</span>";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // OCULTAR ELEMENTOS EN MODO AR
        // =====================================================

        AFRAME.registerComponent(
            'ocultar-en-ar',
            {

                init: function () {

                    const elemento = this.el;

                    const escena =
                        elemento.sceneEl;


                    escena.addEventListener(
                        'enter-vr',
                        function () {

                            if (
                                escena.is('ar-mode')
                            ) {

                                elemento.setAttribute(
                                    'visible',
                                    false
                                );

                            }

                        }
                    );


                    escena.addEventListener(
                        'exit-vr',
                        function () {

                            elemento.setAttribute(
                                'visible',
                                true
                            );

                        }
                    );

                }

            }
        );



        // =====================================================
        // MOVIMIENTO VERTICAL PARA PC
        //
        // E = SUBIR
        // Q = BAJAR
        // =====================================================

        AFRAME.registerComponent(
            'movimiento-vertical',
            {

                schema: {

                    velocidad: {

                        type: 'number',

                        default: 1.5
                    },


                    alturaMinima: {

                        type: 'number',

                        default: 0.3
                    },


                    alturaMaxima: {

                        type: 'number',

                        default: 4.0
                    }

                },


                init: function () {

                    this.subiendo = false;

                    this.bajando = false;


                    this.presionarTecla =
                        (event) => {

                            const tecla =
                                event.key.toLowerCase();


                            if (tecla === 'e') {

                                this.subiendo =
                                    true;

                            }


                            if (tecla === 'q') {

                                this.bajando =
                                    true;

                            }

                        };


                    this.soltarTecla =
                        (event) => {

                            const tecla =
                                event.key.toLowerCase();


                            if (tecla === 'e') {

                                this.subiendo =
                                    false;

                            }


                            if (tecla === 'q') {

                                this.bajando =
                                    false;

                            }

                        };


                    window.addEventListener(
                        'keydown',
                        this.presionarTecla
                    );


                    window.addEventListener(
                        'keyup',
                        this.soltarTecla
                    );

                },


                tick: function (
                    tiempo,
                    delta
                ) {


                    if (!delta) {

                        return;
                    }


                    /*
                    No modificamos la posición
                    cuando estamos dentro de XR.
                    */

                    if (
                        this.el.sceneEl.is('vr-mode')
                    ) {

                        return;
                    }


                    const dt =
                        delta / 1000;


                    const posicion =
                        this.el.object3D.position;



                    // =========================================
                    // SUBIR
                    // =========================================

                    if (this.subiendo) {

                        posicion.y +=
                            this.data.velocidad *
                            dt;

                    }



                    // =========================================
                    // BAJAR
                    // =========================================

                    if (this.bajando) {

                        posicion.y -=
                            this.data.velocidad *
                            dt;

                    }



                    // =========================================
                    // LIMITAR ALTURA
                    // =========================================

                    posicion.y =
                        Math.max(

                            this.data.alturaMinima,

                            Math.min(

                                this.data.alturaMaxima,

                                posicion.y

                            )

                        );

                },


                remove: function () {

                    window.removeEventListener(
                        'keydown',
                        this.presionarTecla
                    );


                    window.removeEventListener(
                        'keyup',
                        this.soltarTecla
                    );

                }

            }
        );



        // =====================================================
        // COLOCACIÓN FIJA DEL MODELO EN AR
        // =====================================================

        AFRAME.registerComponent(
            'colocacion-fija-ar',
            {

                init: function () {


                    const escena =
                        this.el;


                    this.modelo =
                        document.getElementById(
                            'objetoXR'
                        );


                    this.punto =
                        document.getElementById(
                            'puntoColocacionAR'
                        );


                    this.colocado =
                        false;



                    // =================================================
                    // ENTRAR EN AR
                    // =================================================

                    escena.addEventListener(
                        'enter-vr',
                        () => {


                            if (
                                !escena.is('ar-mode')
                            ) {

                                return;

                            }


                            this.colocado =
                                false;


                            // Ocultar robot mientras
                            // buscamos superficie.

                            this.modelo.setAttribute(
                                'visible',
                                false
                            );


                            this.punto.setAttribute(
                                'visible',
                                true
                            );


                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "Mueve lentamente el teléfono.<br>" +
                                    "Apunta hacia una mesa o el piso.";

                            }

                        }
                    );



                    // =================================================
                    // COMIENZA HIT TEST
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-start',
                        () => {


                            if (
                                this.colocado
                            ) {

                                return;

                            }


                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "Buscando superficie..." +
                                    "<br>" +
                                    "Mueve lentamente el dispositivo.";

                            }

                        }
                    );



                    // =================================================
                    // SUPERFICIE DETECTADA
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-achieved',
                        () => {


                            if (
                                this.colocado
                            ) {

                                return;

                            }


                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Superficie detectada." +
                                    "</span>" +
                                    "<br>" +
                                    "Toca la pantalla para fijar el robot.";

                            }

                        }
                    );



                    // =================================================
                    // TOCAR PARA COLOCAR
                    // =================================================

                    escena.addEventListener(
                        'ar-hit-test-select',
                        () => {


                            if (
                                this.colocado
                            ) {

                                return;

                            }


                            if (
                                !escena.is('ar-mode')
                            ) {

                                return;

                            }


                            requestAnimationFrame(
                                () => {


                                    const posicion =
                                        new THREE.Vector3();


                                    // Obtener posición
                                    // de la superficie.

                                    this.punto.object3D
                                        .getWorldPosition(
                                            posicion
                                        );


                                    // Copiar solamente posición.
                                    //
                                    // NO copiamos la rotación,
                                    // así el robot permanece vertical.

                                    this.modelo.object3D
                                        .position
                                        .copy(
                                            posicion
                                        );


                                    this.modelo.setAttribute(
                                        'visible',
                                        true
                                    );


                                    // Ocultar marcador.

                                    this.punto.setAttribute(
                                        'visible',
                                        false
                                    );


                                    // Bloquear.

                                    this.colocado =
                                        true;



                                    const texto =
                                        document.getElementById(
                                            'instruccionAR'
                                        );


                                    if (texto) {

                                        texto.innerHTML =
                                            "<span class='ok'>" +
                                            "Robot colocado y fijado." +
                                            "</span>" +
                                            "<br>" +
                                            "Ahora camina alrededor para " +
                                            "observarlo desde todos los lados.";

                                    }

                                }
                            );

                        }
                    );



                    // =================================================
                    // SALIR DE AR
                    // =================================================

                    escena.addEventListener(
                        'exit-vr',
                        () => {


                            this.colocado =
                                false;


                            this.modelo.setAttribute(
                                'position',
                                '0 0 -3'
                            );


                            this.modelo.setAttribute(
                                'visible',
                                true
                            );


                            this.punto.setAttribute(
                                'position',
                                '0 -100 0'
                            );


                            this.punto.setAttribute(
                                'visible',
                                true
                            );


                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "En modo AR podrás colocar el modelo " +
                                    "sobre una superficie real.";

                            }

                        }
                    );

                }

            }
        );



        // =====================================================
        // COMPATIBILIDAD WEBXR
        // =====================================================

        async function comprobarXR() {


            const webxr =
                document.getElementById(
                    'estadoWebXR'
                );


            const vr =
                document.getElementById(
                    'estadoVR'
                );


            const ar =
                document.getElementById(
                    'estadoAR'
                );



            if (
                !navigator.xr
            ) {


                webxr.innerHTML =
                    'WebXR: no disponible';

                webxr.className =
                    'error';


                vr.innerHTML =
                    'VR: no disponible';

                vr.className =
                    'error';


                ar.innerHTML =
                    'AR: no disponible';

                ar.className =
                    'error';


                return;

            }



            webxr.innerHTML =
                'WebXR: disponible';

            webxr.className =
                'ok';



            // =================================================
            // VR
            // =================================================

            try {


                const soportaVR =
                    await navigator.xr
                        .isSessionSupported(
                            'immersive-vr'
                        );


                vr.innerHTML =
                    soportaVR
                    ?
                    'VR: compatible'
                    :
                    'VR: no compatible';


                vr.className =
                    soportaVR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                vr.innerHTML =
                    'VR: error';

                vr.className =
                    'error';

            }



            // =================================================
            // AR
            // =================================================

            try {


                const soportaAR =
                    await navigator.xr
                        .isSessionSupported(
                            'immersive-ar'
                        );


                ar.innerHTML =
                    soportaAR
                    ?
                    'AR: compatible'
                    :
                    'AR: no compatible';


                ar.className =
                    soportaAR
                    ?
                    'ok'
                    :
                    'error';


            }

            catch (error) {


                ar.innerHTML =
                    'AR: error';

                ar.className =
                    'error';

            }

        }



        window.addEventListener(
            'load',
            comprobarXR
        );


    </script>

</head>



<body>



<!-- =========================================================
     PANEL DE INFORMACIÓN
========================================================= -->

<div id="overlay">


    <div id="titulo">

        MODELO CAD INDUSTRIAL XR

    </div>


    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>


    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>


    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>



    <div
        id="estadoModelo"
        class="esperando">

        Modelo CAD: cargando...

    </div>



    <!-- =====================================================
         CONTROLES DE PC
    ====================================================== -->

    <div id="controlesPC">

        <b>Controles PC</b>

        <br>

        W / S = adelante / atrás

        <br>

        A / D = izquierda / derecha

        <br>

        E = subir

        <br>

        Q = bajar / agacharse

        <br>

        Mouse = mirar

    </div>



    <div id="instruccionAR">

        En modo AR podrás colocar el modelo
        sobre una superficie real.

    </div>


</div>



<!-- =========================================================
     ESCENA
========================================================= -->

<a-scene


    xr-mode-ui="
        XRMode: xr
    "


    webxr="
        optionalFeatures: hit-test, dom-overlay;
        referenceSpaceType: local;
        overlayElement: #overlay;
    "


    ar-hit-test="
        target: #puntoColocacionAR;
        type: footprint;
    "


    colocacion-fija-ar


    renderer="
        colorManagement: true;
        antialias: true;
        alpha: true;
    "


    background="
        color: #DCE6EA;
        transparent: true;
    "
>



    <!-- =====================================================
         RECURSOS
    ====================================================== -->

    <a-assets timeout="30000">


        <a-asset-item

            id="modeloIndustrial"

            src="./models/modelo_industrial.glb">

        </a-asset-item>


    </a-assets>



    <!-- =====================================================
         ILUMINACIÓN
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="1">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="1"

        position="-3 5 3">

    </a-light>



    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="0.5"

        position="4 3 -4">

    </a-light>



    <!-- =====================================================
         MARCADOR DE SUPERFICIE AR
    ====================================================== -->

    <a-ring

        id="puntoColocacionAR"

        position="0 -100 0"

        rotation="-90 0 0"

        radius-inner="0.12"

        radius-outer="0.18"

        color="#00FF88"

        material="
            transparent: true;
            opacity: 0.8;
            side: double;
        ">

    </a-ring>



    <!-- =====================================================
         CONTENEDOR DEL MODELO
    ====================================================== -->

    <a-entity

        id="objetoXR"

        position="0 0 -3"

        rotation="0 0 0"

        visible="true"
    >



        <!-- =================================================
             MODELO CAD

             ROTACIÓN 90° EN Y PARA VISTA LATERAL
        ================================================== -->

        <a-entity

            id="robotCAD"

            gltf-model="#modeloIndustrial"

            control-modelo

            position="0 0 0"

            rotation="0 90 0"

            scale="0.01 0.01 0.01"

            shadow="
                cast: true;
                receive: true;
            ">

        </a-entity>


    </a-entity>



    <!-- =====================================================
         PISO
         SOLO PC / VR
    ====================================================== -->

    <a-plane

        ocultar-en-ar

        position="0 0 -3"

        rotation="-90 0 0"

        width="12"

        height="12"

        color="#78909C"

        shadow="
            receive: true;
        ">

    </a-plane>



    <!-- =====================================================
         CIELO
         SOLO PC / VR
    ====================================================== -->

    <a-sky

        ocultar-en-ar

        color="#DCE6EA">

    </a-sky>



    <!-- =====================================================
         RIG DEL USUARIO
         
         Q/E CAMBIAN LA ALTURA DE ESTE ELEMENTO.
    ====================================================== -->

    <a-entity

        id="rig"

        position="0 1.6 0"

        movimiento-vertical="
            velocidad: 1.5;
            alturaMinima: 0.3;
            alturaMaxima: 4;
        "
    >



        <!-- =================================================
             CÁMARA
        ================================================== -->

        <a-camera

            position="0 0 0"

            look-controls

            wasd-controls="
                acceleration: 25;
            ">

        </a-camera>


    </a-entity>



</a-scene>



</body>

</html>
