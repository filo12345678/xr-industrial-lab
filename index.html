<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Laboratorio XR - Celda Industrial</title>


    <!-- =====================================================
         A-FRAME 1.8.0
    ====================================================== -->

    <script
        src="https://aframe.io/releases/1.8.0/aframe.min.js">
    </script>


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        #overlay {

            position: fixed;

            top: 15px;
            left: 15px;

            width: 290px;

            padding: 14px;

            background: rgba(0, 0, 0, 0.72);

            color: white;

            border-radius: 10px;

            z-index: 9999;

            font-size: 13px;

            line-height: 1.5;
        }


        #titulo {

            color: #00ff88;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .ok {
            color: #00ff88;
        }


        .error {
            color: #ff5555;
        }


        .esperando {
            color: #ffcc00;
        }


        #instruccionAR {

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #777;

            color: white;
        }

    </style>


    <script>

        // =====================================================
        // ESTADO DEL HIT TEST
        // =====================================================

        AFRAME.registerComponent(
            'estado-hit-test',
            {

                init: function () {

                    const escena = this.el;


                    escena.addEventListener(
                        'ar-hit-test-start',
                        function () {

                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "Buscando superficies..." +
                                    "<br>" +
                                    "Mueve lentamente el dispositivo.";

                            }

                        }
                    );


                    escena.addEventListener(
                        'ar-hit-test-achieved',
                        function () {

                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Superficie detectada." +
                                    "</span>" +
                                    "<br>" +
                                    "Toca la pantalla para colocar " +
                                    "la celda industrial.";

                            }

                        }
                    );


                    escena.addEventListener(
                        'ar-hit-test-select',
                        function () {

                            const texto =
                                document.getElementById(
                                    'instruccionAR'
                                );


                            if (texto) {

                                texto.innerHTML =
                                    "<span class='ok'>" +
                                    "Celda colocada correctamente." +
                                    "</span>" +
                                    "<br>" +
                                    "Puedes apuntar a otra superficie " +
                                    "y tocar nuevamente.";

                            }

                        }
                    );

                }

            }
        );


        // =====================================================
        // DETECCIÓN DE COMPATIBILIDAD WEBXR
        // =====================================================

        async function detectarCompatibilidadXR() {

            const estadoWebXR =
                document.getElementById(
                    "estadoWebXR"
                );

            const estadoVR =
                document.getElementById(
                    "estadoVR"
                );

            const estadoAR =
                document.getElementById(
                    "estadoAR"
                );


            if (!navigator.xr) {

                estadoWebXR.innerHTML =
                    "WebXR: no disponible";

                estadoWebXR.className =
                    "error";


                estadoVR.innerHTML =
                    "VR: no disponible";

                estadoVR.className =
                    "error";


                estadoAR.innerHTML =
                    "AR: no disponible";

                estadoAR.className =
                    "error";


                return;
            }


            estadoWebXR.innerHTML =
                "WebXR: disponible";

            estadoWebXR.className =
                "ok";


            // =================================================
            // VR
            // =================================================

            try {

                const soportaVR =
                    await navigator.xr
                    .isSessionSupported(
                        "immersive-vr"
                    );


                estadoVR.innerHTML =
                    soportaVR
                    ?
                    "VR: compatible"
                    :
                    "VR: no compatible";


                estadoVR.className =
                    soportaVR
                    ?
                    "ok"
                    :
                    "error";

            }

            catch (error) {

                estadoVR.innerHTML =
                    "VR: error";

                estadoVR.className =
                    "error";

            }


            // =================================================
            // AR
            // =================================================

            try {

                const soportaAR =
                    await navigator.xr
                    .isSessionSupported(
                        "immersive-ar"
                    );


                estadoAR.innerHTML =
                    soportaAR
                    ?
                    "AR: compatible"
                    :
                    "AR: no compatible";


                estadoAR.className =
                    soportaAR
                    ?
                    "ok"
                    :
                    "error";

            }

            catch (error) {

                estadoAR.innerHTML =
                    "AR: error";

                estadoAR.className =
                    "error";

            }

        }


        window.addEventListener(
            "load",
            detectarCompatibilidadXR
        );

    </script>

</head>



<body>


<!-- =========================================================
     PANEL DE INFORMACIÓN
========================================================= -->

<div id="overlay">

    <div id="titulo">
        CELDA INDUSTRIAL XR
    </div>


    <div
        id="estadoWebXR"
        class="esperando">

        WebXR: comprobando...

    </div>


    <div
        id="estadoVR"
        class="esperando">

        VR: comprobando...

    </div>


    <div
        id="estadoAR"
        class="esperando">

        AR: comprobando...

    </div>


    <div id="instruccionAR">

        En AR podrás colocar la celda
        sobre una superficie real.

    </div>

</div>



<!-- =========================================================
     ESCENA PRINCIPAL
========================================================= -->

<a-scene

    xr-mode-ui="
        XRMode: xr
    "

    webxr="
        referenceSpaceType: local;
        optionalFeatures: hit-test,dom-overlay;
        overlayElement: #overlay;
    "

    ar-hit-test="
        target: #objetoXR;
        type: footprint;
    "

    estado-hit-test

    renderer="
        colorManagement: true;
        alpha: true;
    "

    background="
        color: #ECECEC;
        transparent: true;
    "
>


    <!-- =====================================================
         ILUMINACIÓN
    ====================================================== -->

    <a-light

        type="ambient"

        color="#FFFFFF"

        intensity="0.85">

    </a-light>


    <a-light

        type="directional"

        color="#FFFFFF"

        intensity="0.8"

        position="-2 4 2">

    </a-light>



    <!-- =====================================================
         MODELO INDUSTRIAL COMPLETO

         Este es el grupo que moverá WebXR Hit Test.
    ====================================================== -->

    <a-entity

        id="objetoXR"

        hide-on-enter-ar

        position="0 0 -4"

        scale="0.45 0.45 0.45"
    >


        <!-- =================================================
             PISO DE LA CELDA
        ================================================== -->

        <a-plane

            position="0 0.02 0"

            rotation="-90 0 0"

            width="7.5"

            height="4.5"

            color="#B0BEC5"

            material="
                roughness: 0.9
            "

            shadow="receive: true">

        </a-plane>



        <!-- =================================================
             BANDA TRANSPORTADORA
        ================================================== -->

        <a-entity id="bandaTransportadora">


            <!-- =============================================
                 ESTRUCTURA PRINCIPAL
            ============================================== -->

            <a-box

                position="-0.2 1 0"

                width="5"

                height="0.25"

                depth="1.5"

                color="#455A64"

                shadow>

            </a-box>



            <!-- =============================================
                 CINTA NEGRA
            ============================================== -->

            <a-box

                position="-0.2 1.17 0"

                width="4.65"

                height="0.08"

                depth="1.18"

                color="#212121"

                shadow>

            </a-box>



            <!-- =============================================
                 LATERAL IZQUIERDO
            ============================================== -->

            <a-box

                position="-0.2 1.32 -0.68"

                width="5"

                height="0.15"

                depth="0.12"

                color="#78909C">

            </a-box>



            <!-- =============================================
                 LATERAL DERECHO
            ============================================== -->

            <a-box

                position="-0.2 1.32 0.68"

                width="5"

                height="0.15"

                depth="0.12"

                color="#78909C">

            </a-box>



            <!-- =============================================
                 RODILLO 1
            ============================================== -->

            <a-cylinder

                position="-2.45 1.18 0"

                rotation="90 0 0"

                radius="0.23"

                height="1.35"

                color="#90A4AE"

                metalness="0.6">

            </a-cylinder>



            <!-- =============================================
                 RODILLO 2
            ============================================== -->

            <a-cylinder

                position="2.05 1.18 0"

                rotation="90 0 0"

                radius="0.23"

                height="1.35"

                color="#90A4AE"

                metalness="0.6">

            </a-cylinder>



            <!-- =============================================
                 RODILLOS INTERMEDIOS
            ============================================== -->

            <a-cylinder
                position="-1.5 1.10 0"
                rotation="90 0 0"
                radius="0.09"
                height="1.15"
                color="#607D8B">
            </a-cylinder>


            <a-cylinder
                position="-0.6 1.10 0"
                rotation="90 0 0"
                radius="0.09"
                height="1.15"
                color="#607D8B">
            </a-cylinder>


            <a-cylinder
                position="0.3 1.10 0"
                rotation="90 0 0"
                radius="0.09"
                height="1.15"
                color="#607D8B">
            </a-cylinder>


            <a-cylinder
                position="1.2 1.10 0"
                rotation="90 0 0"
                radius="0.09"
                height="1.15"
                color="#607D8B">
            </a-cylinder>



            <!-- =============================================
                 PATAS
            ============================================== -->

            <a-box

                position="-2.1 0.48 -0.55"

                width="0.18"

                height="0.95"

                depth="0.18"

                color="#607D8B">

            </a-box>


            <a-box

                position="-2.1 0.48 0.55"

                width="0.18"

                height="0.95"

                depth="0.18"

                color="#607D8B">

            </a-box>


            <a-box

                position="1.7 0.48 -0.55"

                width="0.18"

                height="0.95"

                depth="0.18"

                color="#607D8B">

            </a-box>


            <a-box

                position="1.7 0.48 0.55"

                width="0.18"

                height="0.95"

                depth="0.18"

                color="#607D8B">

            </a-box>



            <!-- =============================================
                 TRAVESAÑOS
            ============================================== -->

            <a-box

                position="-2.1 0.25 0"

                width="0.15"

                height="0.15"

                depth="1.15"

                color="#455A64">

            </a-box>


            <a-box

                position="1.7 0.25 0"

                width="0.15"

                height="0.15"

                depth="1.15"

                color="#455A64">

            </a-box>



            <!-- =============================================
                 CAJA FIJA
            ============================================== -->

            <a-box

                position="-1.7 1.55 0"

                width="0.6"

                height="0.65"

                depth="0.55"

                color="#FF9800"

                shadow>

            </a-box>



            <!-- =============================================
                 PRODUCTO EN MOVIMIENTO
            ============================================== -->

            <a-box

                position="-1.1 1.55 0"

                width="0.55"

                height="0.65"

                depth="0.55"

                color="#FFC107"

                shadow

                animation="
                    property: position;
                    from: -1.2 1.55 0;
                    to: 1.55 1.55 0;
                    dur: 5000;
                    easing: linear;
                    loop: true;
                ">

            </a-box>


        </a-entity>



        <!-- =================================================
             SENSOR FOTOELÉCTRICO
        ================================================== -->

        <a-entity
            id="sensorFotoelectrico"
        >


            <!-- SOPORTE VERTICAL -->

            <a-cylinder

                position="0.55 1.5 -1"

                radius="0.07"

                height="1"

                color="#263238">

            </a-cylinder>



            <!-- BRAZO -->

            <a-box

                position="0.55 1.97 -0.65"

                width="0.14"

                height="0.14"

                depth="0.7"

                color="#263238">

            </a-box>



            <!-- CABEZA DEL SENSOR -->

            <a-box

                position="0.55 1.97 -0.27"

                width="0.28"

                height="0.24"

                depth="0.25"

                color="#37474F">

            </a-box>



            <!-- INDICADOR DEL SENSOR -->

            <a-sphere

                position="0.55 1.98 -0.13"

                radius="0.075"

                color="#00E676"

                animation="
                    property: material.emissiveIntensity;
                    from: 0;
                    to: 1;
                    dur: 700;
                    dir: alternate;
                    loop: true;
                "

                material="
                    emissive: #00E676;
                    emissiveIntensity: 0.8;
                ">

            </a-sphere>



            <!-- HAZ DEL SENSOR -->

            <a-box

                position="0.55 1.63 0"

                width="0.035"

                height="0.035"

                depth="1.25"

                color="#F44336"

                material="
                    transparent: true;
                    opacity: 0.55;
                    emissive: #F44336;
                ">

            </a-box>


        </a-entity>



        <!-- =================================================
             PANEL DE CONTROL
        ================================================== -->

        <a-entity

            id="panelControl"

            position="2.75 0 1.15"
        >


            <!-- POSTE -->

            <a-box

                position="0 0.65 0"

                width="0.18"

                height="1.3"

                depth="0.18"

                color="#455A64">

            </a-box>



            <!-- GABINETE -->

            <a-box

                position="0 1.55 0"

                width="1"

                height="1.15"

                depth="0.55"

                color="#607D8B"

                shadow>

            </a-box>



            <!-- MARCO DE PANTALLA -->

            <a-box

                position="0 1.72 -0.29"

                width="0.68"

                height="0.43"

                depth="0.04"

                color="#263238">

            </a-box>



            <!-- PANTALLA -->

            <a-box

                position="0 1.72 -0.32"

                width="0.58"

                height="0.33"

                depth="0.025"

                color="#2196F3"

                material="
                    emissive: #1565C0;
                    emissiveIntensity: 0.4;
                ">

            </a-box>



            <!-- BOTÓN VERDE -->

            <a-cylinder

                position="-0.22 1.30 -0.32"

                rotation="90 0 0"

                radius="0.09"

                height="0.05"

                color="#00E676">

            </a-cylinder>



            <!-- BOTÓN ROJO -->

            <a-cylinder

                position="0.22 1.30 -0.32"

                rotation="90 0 0"

                radius="0.09"

                height="0.05"

                color="#F44336">

            </a-cylinder>



            <!-- BALIZA -->

            <a-cylinder

                position="0 2.25 0"

                radius="0.11"

                height="0.35"

                color="#FFC107"

                material="
                    emissive: #FFC107;
                    emissiveIntensity: 0.6;
                ">

            </a-cylinder>


        </a-entity>



        <!-- =================================================
             MESA / ZONA DE RECEPCIÓN
        ================================================== -->

        <a-entity

            id="zonaRecepcion"

            position="2.7 0 -0.25"
        >


            <!-- TABLERO -->

            <a-box

                position="0 0.85 0"

                width="1.15"

                height="0.15"

                depth="1.4"

                color="#CFD8DC"

                shadow>

            </a-box>



            <!-- PATAS -->

            <a-box
                position="-0.45 0.4 -0.5"
                width="0.15"
                height="0.8"
                depth="0.15"
                color="#607D8B">
            </a-box>


            <a-box
                position="0.45 0.4 -0.5"
                width="0.15"
                height="0.8"
                depth="0.15"
                color="#607D8B">
            </a-box>


            <a-box
                position="-0.45 0.4 0.5"
                width="0.15"
                height="0.8"
                depth="0.15"
                color="#607D8B">
            </a-box>


            <a-box
                position="0.45 0.4 0.5"
                width="0.15"
                height="0.8"
                depth="0.15"
                color="#607D8B">
            </a-box>



            <!-- PRODUCTO TERMINADO -->

            <a-box

                position="0 1.2 0"

                width="0.55"

                height="0.55"

                depth="0.55"

                color="#8BC34A"

                shadow>

            </a-box>


        </a-entity>



        <!-- =================================================
             MARCAS DE SEGURIDAD
        ================================================== -->

        <a-box

            position="0 -0.01 -1.7"

            width="6.2"

            height="0.025"

            depth="0.08"

            color="#FFC107">

        </a-box>


        <a-box

            position="0 -0.01 1.7"

            width="6.2"

            height="0.025"

            depth="0.08"

            color="#FFC107">

        </a-box>


    </a-entity>



    <!-- =====================================================
         PISO GENERAL
         SOLO SE VE FUERA DE AR
    ====================================================== -->

    <a-plane

        hide-on-enter-ar

        position="0 0 -4"

        rotation="-90 0 0"

        width="14"

        height="14"

        color="#78909C"

        shadow="receive: true">

    </a-plane>



    <!-- =====================================================
         CIELO
         SE OCULTA AL ENTRAR EN AR
    ====================================================== -->

    <a-sky

        hide-on-enter-ar

        color="#DCE6EA">

    </a-sky>



    <!-- =====================================================
         CÁMARA
    ====================================================== -->

    <a-entity
        position="0 1.6 0">

        <a-camera

            look-controls

            wasd-controls>

        </a-camera>

    </a-entity>


</a-scene>


</body>

</html>
