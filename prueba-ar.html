<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

    <title>Prueba AR</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

</head>


<body>


<a-scene

    xr-mode-ui="XRMode: ar"

    webxr="
        requiredFeatures: hit-test;
        optionalFeatures: dom-overlay;
    "

    ar-hit-test="
        target: #objetoPrueba;
        type: footprint;
    "

    renderer="
        antialias: true;
        colorManagement: true;
        alpha: true;
    "
>


    <!-- =====================================================
         OBJETO MUY SIMPLE PARA PROBAR EL TRACKING
    ====================================================== -->

    <a-box

        id="objetoPrueba"

        position="0 0 -2"

        width="0.25"

        height="0.25"

        depth="0.25"

        color="#4CC3D9"

        hide-on-enter-ar>

    </a-box>


    <!-- =====================================================
         PISO SOLO PARA VISTA NORMAL
    ====================================================== -->

    <a-plane

        position="0 0 -3"

        rotation="-90 0 0"

        width="5"

        height="5"

        color="#7BC8A4"

        hide-on-enter-ar>

    </a-plane>


    <a-sky

        color="#ECECEC"

        hide-on-enter-ar>

    </a-sky>


    <a-camera></a-camera>


</a-scene>


</body>

</html>
